name: Probe beta catalog metadata runtime

on:
  push:
    branches: [ main ]
    paths:
      - '.github/workflows/diagnose-beta-catalog-runtime.yml'

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - name: Download beta binary
        run: curl -fL https://github.com/00-Evan/shattered-pixel-dungeon/releases/download/4.0.0-beta/ShatteredPD-v4.0.0-BETA-4-Java.jar -o spd4.jar
      - name: Probe catalog metadata paths
        run: |
          cat > ProbeCatalog.java <<'JAVA'
          import com.shatteredpixel.shatteredpixeldungeon.items.Item;
          import com.shatteredpixel.shatteredpixeldungeon.items.armor.Armor;
          import com.shatteredpixel.shatteredpixeldungeon.items.weapon.Weapon;
          import com.shatteredpixel.shatteredpixeldungeon.journal.Catalog;
          import java.util.*;

          public class ProbeCatalog {
              public static void main(String[] args) {
                  Set<String> betaOnly = new HashSet<>(Arrays.asList(
                      "com.shatteredpixel.shatteredpixeldungeon.items.quest.EscapeCrystal",
                      "com.shatteredpixel.shatteredpixeldungeon.items.quest.ImpStatue",
                      "com.shatteredpixel.shatteredpixeldungeon.items.quest.VaultBeacon",
                      "com.shatteredpixel.shatteredpixeldungeon.items.weapon.curses.Pressurized",
                      "com.shatteredpixel.shatteredpixeldungeon.items.weapon.curses.Wondrous",
                      "com.shatteredpixel.shatteredpixeldungeon.items.weapon.enchantments.Crystal",
                      "com.shatteredpixel.shatteredpixeldungeon.items.weapon.enchantments.Eldritch",
                      "com.shatteredpixel.shatteredpixeldungeon.items.weapon.enchantments.Venomous",
                      "com.shatteredpixel.shatteredpixeldungeon.items.weapon.enchantments.Vorpal"
                  ));
                  for (Catalog c : Catalog.values()) {
                      for (Class<?> k : c.items()) {
                          if (!betaOnly.contains(k.getName())) continue;
                          System.out.println("BEGIN\t" + c.name() + "\t" + k.getName());
                          try {
                              Object x = k.getDeclaredConstructor().newInstance();
                              System.out.println("  ctor=OK");
                              if (x instanceof Item) {
                                  Item i = (Item)x;
                                  System.out.println("  image=" + i.image + " icon=" + i.icon);
                                  System.out.println("  name=" + safe(() -> i.name()));
                                  System.out.println("  info=" + safe(() -> i.info()));
                                  System.out.println("  glowing=" + safe(() -> String.valueOf(i.glowing())));
                              } else if (x instanceof Weapon.Enchantment) {
                                  Weapon.Enchantment e = (Weapon.Enchantment)x;
                                  System.out.println("  name=" + safe(() -> e.name()));
                                  System.out.println("  desc=" + safe(() -> e.desc()));
                                  System.out.println("  glowing=" + safe(() -> String.valueOf(e.glowing())));
                              } else if (x instanceof Armor.Glyph) {
                                  Armor.Glyph g = (Armor.Glyph)x;
                                  System.out.println("  name=" + safe(() -> g.name()));
                                  System.out.println("  desc=" + safe(() -> g.desc()));
                                  System.out.println("  glowing=" + safe(() -> String.valueOf(g.glowing())));
                              }
                          } catch (Throwable t) {
                              System.out.println("  ctor=FAIL " + t);
                              t.printStackTrace(System.out);
                          }
                          System.out.println("END");
                      }
                  }
              }
              interface Op { String get() throws Throwable; }
              static String safe(Op op) {
                  try { return "OK " + op.get(); }
                  catch (Throwable t) { return "FAIL " + t; }
              }
          }
          JAVA
          javac -cp spd4.jar ProbeCatalog.java
          java -cp spd4.jar:. ProbeCatalog
