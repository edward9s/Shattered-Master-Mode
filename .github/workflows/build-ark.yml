name: Build ARK

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout ARK_PD
        uses: actions/checkout@v4
        with:
          repository: tomorrows-ark-pd/ARK_PD
          path: ARK_PD

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Make gradlew executable
        working-directory: ARK_PD
        run: chmod +x gradlew

      - name: Patch desktop release JAR duplicate handling
        working-directory: ARK_PD
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path("desktop/build.gradle")
          text = path.read_text()
          needle = "task release(dependsOn: compileForRelease, type: Jar) {\n"
          patch = needle + "    duplicatesStrategy = org.gradle.api.file.DuplicatesStrategy.EXCLUDE\n"

          if "duplicatesStrategy = org.gradle.api.file.DuplicatesStrategy.EXCLUDE" not in text:
              if needle not in text:
                  raise SystemExit("Could not locate desktop release Jar task")
              text = text.replace(needle, patch, 1)
              path.write_text(text)
          PY

      - name: Build release APK and JAR
        working-directory: ARK_PD
        run: ./gradlew :android:assembleRelease :desktop:release

      - name: Determine artifact names
        run: |
          APK=$(find ARK_PD/android/build/outputs/apk/release -maxdepth 1 -type f -name '*.apk' | head -1)
          JAR=$(find ARK_PD/desktop/build/libs -maxdepth 1 -type f -name '*.jar' | head -1)
          test -n "$APK" -a -f "$APK"
          test -n "$JAR" -a -f "$JAR"

          APK_NAME=$(basename "$APK")
          BASE_NAME="${APK_NAME%.apk}"

          echo "SOURCE_JAR=$JAR" >> "$GITHUB_ENV"
          echo "BASE_NAME=$BASE_NAME" >> "$GITHUB_ENV"
          echo "OUTPUT_APK=${BASE_NAME}.apk" >> "$GITHUB_ENV"
          echo "OUTPUT_JAR=${BASE_NAME}.jar" >> "$GITHUB_ENV"

      - name: Install Android build tools for signer
        run: $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager "build-tools;29.0.3"

      - name: Sign Android APK
        uses: r0adkll/sign-android-release@v1
        id: sign
        with:
          releaseDirectory: ARK_PD/android/build/outputs/apk/release
          signingKeyBase64: ${{ secrets.KEYSTORE_BASE64 }}
          alias: ${{ secrets.KEY_ALIAS }}
          keyStorePassword: ${{ secrets.STORE_PASSWORD }}
          keyPassword: ${{ secrets.KEY_PASSWORD }}

      - name: Prepare artifacts
        run: |
          mkdir -p out
          cp "${{ steps.sign.outputs.signedReleaseFile }}" "out/$OUTPUT_APK"
          cp "$SOURCE_JAR" "out/$OUTPUT_JAR"

      - name: Upload signed APK
        uses: actions/upload-artifact@v4
        with:
          retention-days: 7
          name: ${{ env.BASE_NAME }}-APK
          path: out/${{ env.OUTPUT_APK }}
          if-no-files-found: error

      - name: Upload JAR
        uses: actions/upload-artifact@v4
        with:
          retention-days: 7
          name: ${{ env.BASE_NAME }}-JAR
          path: out/${{ env.OUTPUT_JAR }}
          if-no-files-found: error
