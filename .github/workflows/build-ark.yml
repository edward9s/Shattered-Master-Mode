name: Build ARK

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout ARK_PD
        uses: actions/checkout@v4
        with:
          repository: tomorrows-ark-pd/ARK_PD

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Make gradlew executable
        run: chmod +x gradlew

      - name: Build release APK and JAR
        run: ./gradlew :android:assembleRelease :desktop:release

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: ARK-release-apk
          path: android/build/outputs/apk/release/*.apk
          if-no-files-found: error

      - name: Upload JAR
        uses: actions/upload-artifact@v4
        with:
          name: ARK-release-jar
          path: desktop/build/libs/*.jar
          if-no-files-found: error
