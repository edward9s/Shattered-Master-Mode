name: Validate full SMM injection

on:
  push:
    branches: [ main ]
    paths:
      - '.github/workflows/validate-full-smm-injection.yml'
      - 'core/src/main/java/com/spd/mod/**'
      - 'scripts/inject_smm_apk.py'
      - 'scripts/inject_smm_jar.py'
      - 'scripts/inject_apk.py'
      - 'scripts/inject_jar.py'
      - 'scripts/patch_android.py'

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          path: mod
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v3

      - name: Checkout SPD v3.3.8
        run: git clone --depth 1 --branch v3.3.8 https://github.com/00-Evan/shattered-pixel-dungeon.git spd_src

      - name: Build fresh Android and desktop SMM donors
        run: |
          python mod/scripts/patch_android.py
          python mod/scripts/inject_mod.py spd_src/core/src/main/java/com/shatteredpixel/shatteredpixeldungeon/windows/WndGame.java
          cp -a mod/core spd_src/
          cp -a mod/android spd_src/ 2>/dev/null || true
          cp -a mod/desktop spd_src/ 2>/dev/null || true
          cp -a mod/assets spd_src/ 2>/dev/null || true
          python mod/scripts/patch_depth.py 26
          chmod +x spd_src/gradlew
          (cd spd_src && ./gradlew android:assembleRelease :desktop:release)
          DONOR_APK=$(find spd_src/android/build/outputs/apk/release -name '*.apk' | head -1)
          DONOR_JAR=$(find spd_src/desktop/build/libs -name '*.jar' | head -1)
          test -n "$DONOR_APK" -a -n "$DONOR_JAR"
          echo "DONOR_APK=$DONOR_APK" >> "$GITHUB_ENV"
          echo "DONOR_JAR=$DONOR_JAR" >> "$GITHUB_ENV"

      - name: Verify complete Android keep rule was applied
        run: grep -F -- '-keep class com.spd.mod.** { *; }' spd_src/android/proguard-rules.pro

      - name: Download representative clean targets
        run: |
          mkdir -p targets
          curl -fL https://github.com/00-Evan/shattered-pixel-dungeon/releases/download/v3.3.8/ShatteredPD-v3.3.8-Android.apk -o targets/spd.apk
          curl -fL https://github.com/00-Evan/shattered-pixel-dungeon/releases/download/v3.3.8/ShatteredPD-v3.3.8-Java.jar -o targets/spd.jar
          curl -fL https://github.com/TrashboxBobylev/Rat-King-Adventure/releases/download/2.3.3/android-release.apk -o targets/rka.apk
          curl -fL https://github.com/TrashboxBobylev/Rat-King-Adventure/releases/download/2.3.3/desktop-2.3.3.jar -o targets/rka.jar

      - name: Validate official SPD APK full injection
        run: python mod/scripts/inject_smm_apk.py "$DONOR_APK" targets/spd.apk --out /tmp/spd-SMM.apk

      - name: Validate RKA APK full injection
        run: python mod/scripts/inject_smm_apk.py "$DONOR_APK" targets/rka.apk --out /tmp/rka-SMM.apk

      - name: Validate official SPD JAR full injection
        run: python mod/scripts/inject_smm_jar.py "$DONOR_JAR" targets/spd.jar --out /tmp/spd-SMM.jar

      - name: Validate RKA JAR full injection
        run: python mod/scripts/inject_smm_jar.py "$DONOR_JAR" targets/rka.jar --out /tmp/rka-SMM.jar
