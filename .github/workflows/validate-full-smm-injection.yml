name: Validate full SMM injection

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          path: mod
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v3

      - name: Checkout SPD v3.3.8
        run: git clone --depth 1 --branch v3.3.8 https://github.com/00-Evan/shattered-pixel-dungeon.git spd_src

      - name: Build fresh injection APK and desktop JAR donors
        run: |
          python mod/scripts/patch_android.py
          python mod/scripts/inject_mod.py spd_src/core/src/main/java/com/shatteredpixel/shatteredpixeldungeon/windows/WndGame.java
          cp -a mod/core spd_src/
          cp -a mod/android spd_src/ 2>/dev/null || true
          cp -a mod/desktop spd_src/ 2>/dev/null || true
          cp -a mod/assets spd_src/ 2>/dev/null || true
          python mod/scripts/patch_depth.py 26
          chmod +x spd_src/gradlew
          (cd spd_src && ./gradlew android:assembleDebug :desktop:release)
          DONOR_APK=$(find spd_src/android/build/outputs/apk/debug -name '*.apk' | head -1)
          DONOR_JAR=$(find spd_src/desktop/build/libs -name '*.jar' | head -1)
          test -n "$DONOR_APK" -a -n "$DONOR_JAR"
          echo "DONOR_APK=$DONOR_APK" >> "$GITHUB_ENV"
          echo "DONOR_JAR=$DONOR_JAR" >> "$GITHUB_ENV"

      - name: Verify normal release payload preservation rule remains present
        run: grep -F -- '-keep class com.spd.mod.** { *; }' spd_src/android/proguard-rules.pro

      - name: Package and verify distributable injection kit
        run: |
          KIT_DIR=/tmp/smm-inject-kit
          python mod/scripts/package_inject_kit.py \
            "$DONOR_APK" "$DONOR_JAR" "$KIT_DIR" \
            --repo-root mod
          python - <<'PY'
          from pathlib import Path
          kit = Path('/tmp/smm-inject-kit')
          required = {
              'smm-inject-donor.apk',
              'smm-inject-donor.jar',
              'inject_apk.py',
              '_inject_apk_core.py',
              'inject_jar.py',
              '_inject_jar_core.py',
              'README.txt',
          }
          names = {p.name for p in kit.iterdir()}
          missing = sorted(required - names)
          if missing:
              raise SystemExit('Injection kit is missing: ' + ', '.join(missing))
          if names != required:
              raise SystemExit('Unexpected injection-kit files: ' + ', '.join(sorted(names - required)))
          print('Minimal flat injection kit packaging: OK')
          PY
          python -m py_compile \
            "$KIT_DIR/inject_apk.py" "$KIT_DIR/_inject_apk_core.py" \
            "$KIT_DIR/inject_jar.py" "$KIT_DIR/_inject_jar_core.py"
          echo "KIT_DIR=$KIT_DIR" >> "$GITHUB_ENV"
          echo "KIT_DONOR_APK=$KIT_DIR/smm-inject-donor.apk" >> "$GITHUB_ENV"
          echo "KIT_DONOR_JAR=$KIT_DIR/smm-inject-donor.jar" >> "$GITHUB_ENV"

      - name: Validate capability-driven APK ABI profile
        run: |
          python - <<'PY'
          import importlib.util
          import pathlib
          import sys

          kit = pathlib.Path('/tmp/smm-inject-kit')
          sys.path.insert(0, str(kit))
          spec = importlib.util.spec_from_file_location('public_inject_apk', kit / 'inject_apk.py')
          mod = importlib.util.module_from_spec(spec)
          sys.modules[spec.name] = mod
          spec.loader.exec_module(mod)

          game = 'Lcom/shatteredpixel/shatteredpixeldungeon/'
          item_desc = game + 'items/Item;'
          hero_desc = game + 'actors/hero/Hero;'
          char_desc = game + 'actors/Char;'
          wnd_desc = game + 'windows/WndGame;'
          red_desc = game + 'ui/RedButton;'
          tracker_desc = game + 'items/weapon/melee/Sai$ComboStrikeTracker;'

          def cls(path, text):
              return mod.injector.SmaliClass.from_text(pathlib.Path(path), text)

          base = {
              item_desc: cls('Item.smali',
                  '.class public ' + item_desc + '\n'
                  '.super Ljava/lang/Object;\n'
                  '.field protected static a:' + hero_desc + '\n'
                  '.field protected static b:' + item_desc + '\n'),
              hero_desc: cls('Hero.smali',
                  '.class public ' + hero_desc + '\n.super ' + char_desc + '\n'),
              char_desc: cls('Char.smali',
                  '.class public ' + char_desc + '\n'
                  '.super Ljava/lang/Object;\n'
                  '.method public attack(' + char_desc + 'FFF)Z\n'
                  '    .locals 1\n'
                  '    const/4 v0, 0x0\n'
                  '    return v0\n'
                  '.end method\n'),
              wnd_desc: cls('WndGame.smali',
                  '.class public ' + wnd_desc + '\n'
                  '.super Ljava/lang/Object;\n'
                  '.method private a(' + red_desc + ')V\n.return-void\n.end method\n'),
              red_desc: cls('RedButton.smali',
                  '.class public ' + red_desc + '\n.super Ljava/lang/Object;\n'),
          }

          structural = dict(base)
          structural[tracker_desc] = cls('TrackerOld.smali',
              '.class public ' + tracker_desc + '\n'
              '.super Ljava/lang/Object;\n'
              '.field private a:I\n'
              '.field private b:F\n')
          profile = mod.detect_target_abi(structural, game)
          if profile.get('item.setCurrent').strategy != mod.ABI_STRUCTURAL:
              raise SystemExit('setCurrent structural capability was not detected')
          if profile.get('wndgame.menuHook').strategy != mod.ABI_RUNTIME:
              raise SystemExit('WndGame runtime capability was not detected')
          if profile.get('duelist.comboHit').strategy != mod.ABI_STRUCTURAL:
              raise SystemExit('old Duelist structural capability was not detected')
          if profile.get('char.incomingAttackHook').strategy != mod.ABI_DIRECT:
              raise SystemExit('Char.attack incoming-attack hook capability was not detected')
          profile.require_compatible()
          mod._current_abi_profile = profile

          donor = (
              '.class public Lcom/spd/mod/items/ModAnkh;\n'
              '.super ' + game + 'items/Ankh;\n'
              '.method public test(' + hero_desc + ')V\n'
              '    invoke-virtual {p0, p1}, Lcom/spd/mod/items/ModAnkh;->setCurrent(' + hero_desc + ')V\n'
              '    return-void\n'
              '.end method\n'
          )
          out, notes = mod.adapt_modankh(donor, structural, item_desc, hero_desc)
          if '->setCurrent(' in out or '->a:' + hero_desc not in out or '->b:' + item_desc not in out:
              raise SystemExit('structural setCurrent rewrite failed')
          if not notes:
              raise SystemExit('structural setCurrent rewrite produced no note')

          semantic = dict(base)
          semantic[tracker_desc] = cls('TrackerNew.smali',
              '.class public ' + tracker_desc + '\n'
              '.super Ljava/lang/Object;\n'
              '.field private comboTime:F\n'
              '.field private initialTime:F\n'
              '.field public hits:I\n'
              '.method private a(' + char_desc + ')V\n.return-void\n.end method\n')
          profile = mod.detect_target_abi(semantic, game)
          combo = profile.get('duelist.comboHit')
          if combo.strategy != mod.ABI_RUNTIME:
              raise SystemExit('renamed addHit(Char) capability was not detected')
          if combo.data.get('proto') != '(' + char_desc + ')V':
              raise SystemExit('renamed addHit(Char) descriptor was not preserved')
          profile.require_compatible()

          exact = dict(base)
          exact[tracker_desc] = cls('TrackerExact.smali',
              '.class public ' + tracker_desc + '\n'
              '.super Ljava/lang/Object;\n'
              '.method public addHit(' + char_desc + ')V\n.return-void\n.end method\n')
          profile = mod.detect_target_abi(exact, game)
          if profile.get('duelist.comboHit').strategy != mod.ABI_DIRECT:
              raise SystemExit('exact addHit(Char) capability was not detected')

          hook = (
              'Lcom/spd/mod/mechanics/ModParryRiposte;->onIncomingAttack('
              + char_desc + char_desc + ')V'
          )

          legacy = dict(base)
          legacy[char_desc] = cls('CharLegacy.smali',
              '.class public ' + char_desc + '\n'
              '.super Ljava/lang/Object;\n'
              '.method public attack(' + char_desc + ')Z\n'
              '    .locals 1\n'
              '    if-nez p1, :alive\n'
              '    const/4 v0, 0x0\n'
              '    return v0\n'
              ':alive\n'
              '    const/4 v0, 0x1\n'
              '    return v0\n'
              '.end method\n')
          profile = mod.detect_target_abi(legacy, game)
          combo = profile.get('duelist.comboHit')
          if combo.strategy != mod.ABI_RUNTIME:
              raise SystemExit('missing Duelist tracker should use runtime no-op compatibility')
          attack = profile.get('char.incomingAttackHook')
          if attack.strategy != mod.ABI_DIRECT:
              raise SystemExit('legacy Char.attack(Char) capability was not detected')
          if attack.data.get('proto') != '(' + char_desc + ')Z':
              raise SystemExit('legacy Char.attack(Char) descriptor was not preserved')
          profile.require_compatible()
          patched_legacy = mod.patch_char_attack(
              legacy[char_desc].text, char_desc, attack.data['proto'])
          if patched_legacy.count(hook) != 1:
              raise SystemExit('legacy Char.attack hook was not inserted exactly once')
          if patched_legacy.index(hook) > patched_legacy.index('if-nez p1'):
              raise SystemExit('legacy Char.attack hook was not inserted before attack resolution')

          sample_char = (
              '.class public ' + char_desc + '\n'
              '.super Ljava/lang/Object;\n'
              '.method public attack(' + char_desc + 'FFF)Z\n'
              '    .locals 1\n'
              '    .param p1, "enemy"    # ' + char_desc + '\n'
              '    if-nez p1, :alive\n'
              '    const/4 v0, 0x0\n'
              '    return v0\n'
              ':alive\n'
              '    const/4 v0, 0x1\n'
              '    return v0\n'
              '.end method\n'
          )
          patched_char = mod.patch_char_attack(sample_char, char_desc)
          if patched_char.count(hook) != 1:
              raise SystemExit('Char.attack hook was not inserted exactly once')
          if patched_char.index(hook) > patched_char.index('if-nez p1'):
              raise SystemExit('Char.attack hook was not inserted before attack resolution')

          print('Capability-driven APK ABI profile: OK')
          PY

      - name: Diagnose full SMM donor ABI
        run: |
          cat > /tmp/diagnose_full_payload.py <<'PY'
          import importlib.util
          import os
          import pathlib
          import sys
          import tempfile

          spec = importlib.util.spec_from_file_location('inj', 'mod/scripts/_inject_apk_core.py')
          inj = importlib.util.module_from_spec(spec)
          sys.modules[spec.name] = inj
          spec.loader.exec_module(inj)
          inj.MOD_ITEM_DESCRIPTOR_PREFIX = 'Lcom/spd/mod/'

          tc = inj.Toolchain(pathlib.Path('/tmp/smm-inject-cache'))
          apktool, java = tc.ensure_apktool()
          with tempfile.TemporaryDirectory() as td:
              dec = pathlib.Path(td) / 'donor'
              inj.run([java.java, '-jar', apktool, 'd', '-f', '-r', '-o', dec, pathlib.Path(os.environ['KIT_DONOR_APK'])])
              idx = inj.index_smali(dec)
              donor_only = []
              fragile = []

              for desc, item in sorted(idx.items()):
                  if not desc.startswith('Lcom/spd/mod/'):
                      continue

                  if desc != inj.MOD_ANKH and not inj.is_modankh_store_root(desc):
                      bad = sorted(
                          dep for dep in inj.smali_dependencies(item)
                          if not dep.startswith(inj.TARGET_API_PREFIXES)
                          and not dep.startswith('Lcom/spd/mod/')
                      )
                      for dep in bad:
                          donor_only.append(f'{desc}: {dep}')

                  for _, owner, name, proto in inj.METHOD_INSN_RE.findall(item.text):
                      if owner.endswith('/items/weapon/melee/Sai$ComboStrikeTracker;') and name == 'addHit':
                          fragile.append(f'{desc}: direct ComboStrikeTracker.addHit{proto}')
                      if name == 'setCurrent' and desc != inj.MOD_ANKH and '/items/' in owner:
                          fragile.append(f'{desc}: direct Item.setCurrent(Hero) outside ModAnkh adapter')

                  for _, owner, name, typ in inj.FIELD_INSN_RE.findall(item.text):
                      if owner.endswith('/input/PointerEvent$Type;') and name == 'CANCEL':
                          fragile.append(f'{desc}: direct PointerEvent.Type.CANCEL field')

              if donor_only:
                  print('Donor-only dependency errors:')
                  for error in donor_only:
                      print('  - ' + error)
                  raise SystemExit('Full SMM injection donor is not self-contained')

              if fragile:
                  print('Fork-sensitive direct ABI references:')
                  for error in fragile:
                      print('  - ' + error)
                  raise SystemExit('SMM contains direct fork-sensitive ABI references')

              print('Full SMM donor ABI lint: OK')
          PY
          python /tmp/diagnose_full_payload.py

      - name: Download representative clean targets
        run: |
          mkdir -p targets
          curl -fL https://github.com/00-Evan/shattered-pixel-dungeon/releases/download/v3.3.8/ShatteredPD-v3.3.8-Android.apk -o targets/spd.apk
          curl -fL https://github.com/00-Evan/shattered-pixel-dungeon/releases/download/v3.3.8/ShatteredPD-v3.3.8-Java.jar -o targets/spd.jar
          curl -fL https://github.com/00-Evan/shattered-pixel-dungeon/releases/download/4.0.0-beta/ShatteredPD-v4.0.0-BETA-4-Android.apk -o targets/spd4beta.apk
          curl -fL https://github.com/00-Evan/shattered-pixel-dungeon/releases/download/4.0.0-beta/ShatteredPD-v4.0.0-BETA-4-Java.jar -o targets/spd4beta.jar
          curl -fL https://github.com/TrashboxBobylev/Rat-King-Adventure/releases/download/2.3.3/android-release.apk -o targets/rka.apk
          curl -fL https://github.com/TrashboxBobylev/Rat-King-Adventure/releases/download/2.3.3/desktop-2.3.3.jar -o targets/rka.jar

      - name: Validate official SPD 3.3.8 APK injection
        id: spd_apk
        continue-on-error: true
        run: python "$KIT_DIR/inject_apk.py" targets/spd.apk --out /tmp/spd-SMM.apk

      - name: Validate official SPD 4.0 beta APK injection
        id: spd4_apk
        continue-on-error: true
        run: python "$KIT_DIR/inject_apk.py" targets/spd4beta.apk --out /tmp/spd4beta-SMM.apk

      - name: Validate RKA APK injection
        id: rka_apk
        continue-on-error: true
        run: python "$KIT_DIR/inject_apk.py" targets/rka.apk --out /tmp/rka-SMM.apk

      - name: Validate official SPD JAR injection
        id: spd_jar
        continue-on-error: true
        run: python "$KIT_DIR/inject_jar.py" targets/spd.jar --out /tmp/spd-SMM.jar

      - name: Validate official SPD 4.0 beta JAR injection
        id: spd4_jar
        continue-on-error: true
        run: python "$KIT_DIR/inject_jar.py" targets/spd4beta.jar --out /tmp/spd4beta-SMM.jar

      - name: Validate RKA JAR injection
        id: rka_jar
        continue-on-error: true
        run: python "$KIT_DIR/inject_jar.py" targets/rka.jar --out /tmp/rka-SMM.jar

      - name: Fail if any full injection target failed
        if: always()
        run: |
          test "${{ steps.spd_apk.outcome }}" = success
          test "${{ steps.spd4_apk.outcome }}" = success
          test "${{ steps.rka_apk.outcome }}" = success
          test "${{ steps.spd_jar.outcome }}" = success
          test "${{ steps.spd4_jar.outcome }}" = success
          test "${{ steps.rka_jar.outcome }}" = success