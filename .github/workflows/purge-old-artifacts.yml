name: Purge old Actions artifacts
on:
  push:
    paths:
      - .github/workflows/purge-old-artifacts.yml
  workflow_dispatch:
permissions:
  actions: write
jobs:
  purge:
    runs-on: ubuntu-latest
    steps:
      - name: Delete artifacts older than 3 days
        uses: actions/github-script@v7
        with:
          script: |
            const cutoff = Date.now() - 3 * 24 * 60 * 60 * 1000;
            const { owner, repo } = context.repo;
            const artifacts = await github.paginate(
              github.rest.actions.listArtifactsForRepo,
              { owner, repo, per_page: 100 },
            );
            let removed = 0;
            let bytes = 0;
            for (const artifact of artifacts) {
              if (Date.parse(artifact.created_at) >= cutoff) continue;
              await github.rest.actions.deleteArtifact({
                owner, repo, artifact_id: artifact.id,
              });
              removed++;
              bytes += artifact.size_in_bytes;
            }
            core.info(`Removed ${removed} artifacts (${bytes} bytes).`);
