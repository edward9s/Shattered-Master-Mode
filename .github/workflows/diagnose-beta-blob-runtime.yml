name: Compare beta blob runtime presentation paths

on:
  push:
    branches: [ main ]
    paths:
      - '.github/workflows/diagnose-beta-blob-runtime.yml'

permissions:
  contents: read

jobs:
  compare:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - name: Download binary baselines
        run: |
          curl -fL https://github.com/00-Evan/shattered-pixel-dungeon/releases/download/v3.3.8/ShatteredPD-v3.3.8-Java.jar -o spd338.jar
          curl -fL https://github.com/00-Evan/shattered-pixel-dungeon/releases/download/4.0.0-beta/ShatteredPD-v4.0.0-BETA-4-Java.jar -o spd4.jar
      - name: Compare Blob subclass sets
        run: |
          cat > DumpBlobs.java <<'JAVA'
          import com.shatteredpixel.shatteredpixeldungeon.actors.blobs.Blob;
          import java.io.*;
          import java.util.*;
          import java.util.jar.*;

          public class DumpBlobs {
              public static void main(String[] args) throws Exception {
                  String jarPath = args[0];
                  ClassLoader cl = DumpBlobs.class.getClassLoader();
                  ArrayList<String> names = new ArrayList<>();
                  try (JarFile jar = new JarFile(jarPath)) {
                      Enumeration<JarEntry> en = jar.entries();
                      while (en.hasMoreElements()) {
                          String n = en.nextElement().getName();
                          if (!n.startsWith("com/shatteredpixel/shatteredpixeldungeon/actors/blobs/") || !n.endsWith(".class")) continue;
                          String clsName = n.substring(0, n.length()-6).replace('/', '.');
                          try {
                              Class<?> c = Class.forName(clsName, false, cl);
                              if (c != Blob.class && Blob.class.isAssignableFrom(c)
                                      && !java.lang.reflect.Modifier.isAbstract(c.getModifiers())
                                      && !c.isAnonymousClass() && !c.isLocalClass() && !c.isSynthetic()
                                      && (!c.isMemberClass() || java.lang.reflect.Modifier.isStatic(c.getModifiers()))) {
                                  names.add(clsName);
                              }
                          } catch (Throwable ignore) {}
                      }
                  }
                  Collections.sort(names);
                  for (String n : names) System.out.println(n);
              }
          }
          JAVA
          javac -cp spd338.jar DumpBlobs.java
          java -cp spd338.jar:. DumpBlobs spd338.jar > blobs338.txt
          rm -f DumpBlobs.class
          javac -cp spd4.jar DumpBlobs.java
          java -cp spd4.jar:. DumpBlobs spd4.jar > blobs4.txt
          echo '===== BETA-only Blobs ====='
          comm -13 blobs338.txt blobs4.txt || true
          echo '===== Removed Blobs ====='
          comm -23 blobs338.txt blobs4.txt || true
      - name: Compare live emitter dependencies
        run: |
          classes=(
            com.watabou.noosa.particles.Emitter
            com.shatteredpixel.shatteredpixeldungeon.effects.Speck
            com.shatteredpixel.shatteredpixeldungeon.effects.particles.ElmoParticle
            com.shatteredpixel.shatteredpixeldungeon.effects.particles.FlameParticle
            com.shatteredpixel.shatteredpixeldungeon.effects.particles.SacrificialParticle
            com.shatteredpixel.shatteredpixeldungeon.effects.particles.SparkParticle
            com.shatteredpixel.shatteredpixeldungeon.effects.particles.WebParticle
            com.shatteredpixel.shatteredpixeldungeon.effects.particles.SnowParticle
            com.shatteredpixel.shatteredpixeldungeon.effects.particles.LeafParticle
            com.shatteredpixel.shatteredpixeldungeon.effects.particles.ShaftParticle
          )
          for cls in "${classes[@]}"; do
            safe=${cls//./_}
            javap -classpath spd338.jar -p -c "$cls" > "$safe.338" || true
            javap -classpath spd4.jar -p -c "$cls" > "$safe.4" || true
            echo "===== $cls ====="
            if cmp -s "$safe.338" "$safe.4"; then
              echo IDENTICAL
            else
              diff -u "$safe.338" "$safe.4" | head -n 250 || true
            fi
          done
