name: One-shot Mod item injection validation

on:
  push:
    branches: [ main ]
    paths:
      - '.github/workflows/one-shot-mod-items-validate.yml'

permissions:
  contents: write

env:
  GIT_AUTHOR_NAME: edward9s
  GIT_AUTHOR_EMAIL: 277983297+edward9s@users.noreply.github.com
  GIT_COMMITTER_NAME: edward9s
  GIT_COMMITTER_EMAIL: 277983297+edward9s@users.noreply.github.com

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          path: mod
          fetch-depth: 0
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v3

      - name: Checkout SPD v3.3.8
        run: git clone --depth 1 --branch v3.3.8 https://github.com/00-Evan/shattered-pixel-dungeon.git spd_src

      - name: Build fresh Android and desktop donors
        run: |
          python mod/scripts/patch_android.py
          python mod/scripts/inject_mod.py spd_src/core/src/main/java/com/shatteredpixel/shatteredpixeldungeon/windows/WndGame.java
          cp -a mod/core spd_src/
          cp -a mod/android spd_src/ 2>/dev/null || true
          cp -a mod/desktop spd_src/ 2>/dev/null || true
          cp -a mod/assets spd_src/ 2>/dev/null || true
          python mod/scripts/patch_depth.py 26
          chmod +x spd_src/gradlew
          (cd spd_src && ./gradlew android:assembleRelease :desktop:release)
          DONOR_APK=$(find spd_src/android/build/outputs/apk/release -name '*.apk' | head -1)
          DONOR_JAR=$(find spd_src/desktop/build/libs -name '*.jar' | head -1)
          test -n "$DONOR_APK" -a -n "$DONOR_JAR"
          echo "DONOR_APK=$DONOR_APK" >> "$GITHUB_ENV"
          echo "DONOR_JAR=$DONOR_JAR" >> "$GITHUB_ENV"

      - name: Verify known bad R8 references are gone
        run: |
          cat > /tmp/check.py <<'PY'
          import importlib.util, pathlib, tempfile, os, sys
          spec = importlib.util.spec_from_file_location('inj', 'mod/scripts/inject_apk.py')
          inj = importlib.util.module_from_spec(spec); sys.modules[spec.name] = inj; spec.loader.exec_module(inj)
          tc = inj.Toolchain(pathlib.Path('/tmp/smm-inject-cache'))
          apktool, java = tc.ensure_apktool()
          failed = False
          with tempfile.TemporaryDirectory() as td:
              dec = pathlib.Path(td)/'donor'
              inj.run([java.java, '-jar', apktool, 'd', '-f', '-r', '-o', dec, pathlib.Path(os.environ['DONOR_APK'])])
              idx = inj.index_smali(dec)
              checks = {
                  'Lcom/spd/mod/items/ModPotionOfResetTier;': {'La3;'},
                  'Lcom/spd/mod/items/ModScrollOfDisplacement$TargetSelector;': {'Lw4;'},
                  'Lcom/spd/mod/items/ModScrollOfLoot;': {'La3;', 'Lj;', 'Ll8;'},
              }
              for root, forbidden in checks.items():
                  deps = inj.smali_dependencies(idx[root])
                  bad = sorted(deps.intersection(forbidden))
                  print(root + ' direct deps: ' + ', '.join(sorted(deps)))
                  if bad:
                      print('FORBIDDEN: ' + ', '.join(bad))
                      failed = True
              if failed:
                  raise SystemExit(1)
          PY
          python /tmp/check.py

      - name: Download clean target artifacts
        run: |
          mkdir -p targets
          curl -fL https://github.com/00-Evan/shattered-pixel-dungeon/releases/download/v3.3.8/ShatteredPD-v3.3.8-Android.apk -o targets/spd.apk
          curl -fL https://github.com/00-Evan/shattered-pixel-dungeon/releases/download/v3.3.8/ShatteredPD-v3.3.8-Java.jar -o targets/spd.jar
          curl -fL https://github.com/TrashboxBobylev/Rat-King-Adventure/releases/download/2.3.3/android-release.apk -o targets/rka.apk
          curl -fL https://github.com/TrashboxBobylev/Rat-King-Adventure/releases/download/2.3.3/desktop-2.3.3.jar -o targets/rka.jar

      - name: Validate official SPD APK injection
        run: python mod/scripts/inject_apk.py "$DONOR_APK" targets/spd.apk --out /tmp/spd-ModItems.apk

      - name: Validate RKA APK injection
        run: python mod/scripts/inject_apk.py "$DONOR_APK" targets/rka.apk --out /tmp/rka-ModItems.apk

      - name: Validate official SPD JAR injection
        run: python mod/scripts/inject_jar.py "$DONOR_JAR" targets/spd.jar --out /tmp/spd-ModItems.jar

      - name: Validate RKA JAR injection
        run: python mod/scripts/inject_jar.py "$DONOR_JAR" targets/rka.jar --out /tmp/rka-ModItems.jar

      - name: Remove one-shot workflow
        if: always()
        working-directory: mod
        run: |
          git config user.name "$GIT_AUTHOR_NAME"
          git config user.email "$GIT_AUTHOR_EMAIL"
          git pull --ff-only origin main
          git rm .github/workflows/one-shot-mod-items-validate.yml
          git commit -m "Remove temporary Mod item validation workflow"
          git push origin main
