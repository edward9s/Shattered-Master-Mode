name: Diagnose beta journal binary ABI

on:
  push:
    branches: [ main ]
    paths:
      - '.github/workflows/diagnose-beta-journal.yml'

permissions:
  contents: read

jobs:
  diagnose:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Download binary baselines
        run: |
          curl -fL https://github.com/00-Evan/shattered-pixel-dungeon/releases/download/v3.3.8/ShatteredPD-v3.3.8-Java.jar -o spd338.jar
          curl -fL https://github.com/00-Evan/shattered-pixel-dungeon/releases/download/4.0.0-beta/ShatteredPD-v4.0.0-BETA-4-Java.jar -o spd4.jar

      - name: Compare journal entry sets
        run: |
          cat > DumpJournal.java <<'JAVA'
          import com.shatteredpixel.shatteredpixeldungeon.journal.Bestiary;
          import com.shatteredpixel.shatteredpixeldungeon.journal.Catalog;
          import java.util.*;

          public class DumpJournal {
              public static void main(String[] args) {
                  for (Catalog c : Catalog.values()) {
                      for (Class<?> k : c.items()) {
                          System.out.println("CATALOG\t" + c.name() + "\t" + k.getName());
                      }
                  }
                  for (Bestiary b : Bestiary.values()) {
                      for (Class<?> k : b.entities()) {
                          System.out.println("BESTIARY\t" + b.name() + "\t" + k.getName());
                      }
                  }
              }
          }
          JAVA
          javac -cp spd338.jar DumpJournal.java
          java -cp spd338.jar:. DumpJournal | sort > journal338.txt
          rm -f DumpJournal.class
          javac -cp spd4.jar DumpJournal.java
          java -cp spd4.jar:. DumpJournal | sort > journal4.txt
          echo '===== Added in BETA-4 ====='
          comm -13 journal338.txt journal4.txt || true
          echo '===== Removed in BETA-4 ====='
          comm -23 journal338.txt journal4.txt || true

      - name: Inspect added beta classes
        run: |
          comm -13 journal338.txt journal4.txt | cut -f3 | while read cls; do
            [ -n "$cls" ] || continue
            echo "===== $cls ====="
            javap -classpath spd4.jar -p -s "$cls" || true
            echo '--- constructor/info/name/glowing bytecode refs ---'
            javap -classpath spd4.jar -p -c "$cls" \
              | grep -E '(^  public .*\(\);|(^  public .* (name|info|desc|glowing)\()|invoke|Field |new )' \
              | head -n 160 || true
          done
