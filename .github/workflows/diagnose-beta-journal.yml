name: Diagnose beta journal binary ABI

on:
  push:
    branches: [ main ]
    paths:
      - '.github/workflows/diagnose-beta-journal.yml'

permissions:
  contents: read

jobs:
  diagnose:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Download binary baselines
        run: |
          curl -fL https://github.com/00-Evan/shattered-pixel-dungeon/releases/download/v3.3.8/ShatteredPD-v3.3.8-Java.jar -o spd338.jar
          curl -fL https://github.com/00-Evan/shattered-pixel-dungeon/releases/download/4.0.0-beta/ShatteredPD-v4.0.0-BETA-4-Java.jar -o spd4.jar

      - name: Compare journal-facing class ABI
        run: |
          set -eu
          classes=(
            com.shatteredpixel.shatteredpixeldungeon.journal.Catalog
            com.shatteredpixel.shatteredpixeldungeon.journal.Bestiary
            com.shatteredpixel.shatteredpixeldungeon.items.Item
            com.shatteredpixel.shatteredpixeldungeon.sprites.ItemSprite
            com.shatteredpixel.shatteredpixeldungeon.sprites.ItemSpriteSheet
            'com.shatteredpixel.shatteredpixeldungeon.sprites.ItemSpriteSheet$Icons'
            com.shatteredpixel.shatteredpixeldungeon.actors.buffs.Buff
            'com.shatteredpixel.shatteredpixeldungeon.actors.buffs.Buff$buffType'
            com.shatteredpixel.shatteredpixeldungeon.ui.ScrollPane
            com.shatteredpixel.shatteredpixeldungeon.ui.ScrollingGridPane
            com.shatteredpixel.shatteredpixeldungeon.windows.WndTabbed
            com.shatteredpixel.shatteredpixeldungeon.tiles.DungeonTerrainTilemap
            com.shatteredpixel.shatteredpixeldungeon.tiles.TerrainFeaturesTilemap
            com.watabou.utils.Reflection
          )
          mkdir -p abi338 abi4
          for cls in "${classes[@]}"; do
            safe=${cls//[^A-Za-z0-9]/_}
            javap -classpath spd338.jar -p -s "$cls" > "abi338/$safe.txt" || true
            javap -classpath spd4.jar -p -s "$cls" > "abi4/$safe.txt" || true
            echo "===== $cls ====="
            diff -u "abi338/$safe.txt" "abi4/$safe.txt" || true
          done

      - name: Inspect beta journal bytecode and catalog members
        run: |
          echo '===== BETA WndJournal signatures ====='
          javap -classpath spd4.jar -p -s com.shatteredpixel.shatteredpixeldungeon.windows.WndJournal || true
          echo '===== BETA WndJournal bytecode references ====='
          javap -classpath spd4.jar -p -c com.shatteredpixel.shatteredpixeldungeon.windows.WndJournal \
            | grep -E 'Catalog|Bestiary|ItemSpriteSheet|Reflection|ScrollingGridPane|TerrainFeaturesTilemap|newInstance|items\(|entities\(' \
            | head -n 300 || true
