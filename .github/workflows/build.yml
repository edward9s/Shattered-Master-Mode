name: Build SMM

env:
  GIT_AUTHOR_NAME: edward9s
  GIT_AUTHOR_EMAIL: 277983297+edward9s@users.noreply.github.com
  GIT_COMMITTER_NAME: edward9s
  GIT_COMMITTER_EMAIL: 277983297+edward9s@users.noreply.github.com

on:
  workflow_dispatch:

concurrency:
  group: smm-test-release
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout Mod Source
        uses: actions/checkout@v4
        with:
          path: mod
          fetch-depth: 0

      - name: Configure Git identity
        run: |
          git config --global user.name "$GIT_AUTHOR_NAME"
          git config --global user.email "$GIT_AUTHOR_EMAIL"

      - name: Resolve Versions
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          REPO="00-Evan/shattered-pixel-dungeon"
          UPSTREAM_TAG=$(gh api "repos/$REPO/releases/latest" --jq '.tag_name // empty')
          if [ -z "$UPSTREAM_TAG" ]; then
            echo "::error::Unable to resolve the latest SPD release tag."
            exit 1
          fi

          MOD_VER=$(python mod/scripts/extract_version.py mod/core/src/main/java/com/spd/mod/ModGame.java)
          if [ -z "$MOD_VER" ]; then
            echo "::error::Unable to resolve the SMM version."
            exit 1
          fi

          EXPECTED_TAG="SPD-${UPSTREAM_TAG}-m${MOD_VER}"

          echo "UPSTREAM_TAG=$UPSTREAM_TAG" >> "$GITHUB_ENV"
          echo "MOD_VER=$MOD_VER" >> "$GITHUB_ENV"
          echo "EXPECTED_TAG=$EXPECTED_TAG" >> "$GITHUB_ENV"
          echo "Building SMM m$MOD_VER against SPD $UPSTREAM_TAG"

      - name: Checkout SPD Source
        uses: actions/checkout@v4
        with:
          repository: 00-Evan/shattered-pixel-dungeon
          ref: ${{ env.UPSTREAM_TAG }}
          path: spd_src

      - uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v3

      - name: Patch & Merge
        run: |
          python mod/scripts/rebase_source.py spd_src mod
          python mod/scripts/patch_android.py spd_src
          python mod/scripts/inject_mod.py spd_src
          
          cp -a mod/core spd_src/ 2>/dev/null || true
          cp -a mod/android spd_src/ 2>/dev/null || true
          cp -a mod/desktop spd_src/ 2>/dev/null || true
          cp -a mod/assets spd_src/ 2>/dev/null || true
          
          python mod/scripts/patch_depth.py 26

      - name: Compile
        working-directory: ./spd_src
        run: |
          chmod +x ./gradlew
          # Release stays unchanged for the normal playable build. Full APK
          # injection uses the non-minified debug APK as its donor so R8 cannot
          # outline com.spd.mod code into donor-only obfuscated helper classes.
          ./gradlew android:assembleRelease android:assembleDebug :desktop:release

      - name: Install Old Build Tools for Signer
        run: $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager "build-tools;29.0.3"

      - name: Sign Android
        uses: r0adkll/sign-android-release@v1
        id: sign
        with:
          releaseDirectory: spd_src/android/build/outputs/apk/release
          signingKeyBase64: ${{ secrets.KEYSTORE_BASE64 }}
          alias: ${{ secrets.KEY_ALIAS }}
          keyStorePassword: ${{ secrets.STORE_PASSWORD }}
          keyPassword: ${{ secrets.KEY_PASSWORD }}

      - name: Package
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python mod/scripts/package_release.py \
            "${{ env.UPSTREAM_TAG }}" \
            "${{ env.MOD_VER }}" \
            "${{ steps.sign.outputs.signedReleaseFile }}"

      - name: Package Full Injection Kit
        run: |
          DONOR_APK=$(find spd_src/android/build/outputs/apk/debug -name '*.apk' | head -1)
          DONOR_JAR=$(find spd_src/desktop/build/libs -name '*.jar' | head -1)
          test -n "$DONOR_APK" -a -f "$DONOR_APK"
          test -n "$DONOR_JAR" -a -f "$DONOR_JAR"
          python mod/scripts/package_inject_kit.py \
            "$DONOR_APK" "$DONOR_JAR" "inject-kit" \
            --repo-root mod

      - name: Package Injection Kit Release ZIP
        run: |
          set -euo pipefail
          (cd inject-kit && zip -q -r "../out/SMM-m${MOD_VER}-InjectKit.zip" .)

      - name: Verify test release files
        shell: bash
        run: |
          set -euo pipefail
          test -f "out/SPD-${UPSTREAM_TAG}-m${MOD_VER}-Android.apk"
          test -f "out/SPD-${UPSTREAM_TAG}-m${MOD_VER}-Java.jar"
          test -f "out/SPD-${UPSTREAM_TAG}-m${MOD_VER}-Windows.zip"
          test -f "out/SMM-m${MOD_VER}-InjectKit.zip"
          test "$(find out -maxdepth 1 -type f | wc -l)" -eq 4

      - name: Publish rolling test release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          TEST_TAG: build-test
        run: |
          set -euo pipefail
          notes=$(printf 'Latest successful manual SMM test build.\n\nSMM commit: %s\nSPD: %s\nSMM: m%s\n' \
            "$GITHUB_SHA" "$UPSTREAM_TAG" "$MOD_VER")
          if gh release view "$TEST_TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release upload "$TEST_TAG" out/* --repo "$GITHUB_REPOSITORY" --clobber
            gh release edit "$TEST_TAG" --repo "$GITHUB_REPOSITORY" \
              --title "SMM test build" --notes "$notes" --prerelease
          else
            gh release create "$TEST_TAG" out/* \
              --repo "$GITHUB_REPOSITORY" \
              --target "$GITHUB_SHA" \
              --title "SMM test build" \
              --notes "$notes" \
              --prerelease \
              --latest=false
          fi

          # Drop binaries from older test versions after successful upload.
          while IFS='|' read -r asset_id asset_name; do
            case "$asset_name" in
              *.apk|*.jar|*.zip)
                if [[ ! -f "out/$asset_name" ]]; then
                  gh api --method DELETE "repos/$GITHUB_REPOSITORY/releases/assets/$asset_id"
                fi
                ;;
            esac
          done < <(gh api "repos/$GITHUB_REPOSITORY/releases/tags/$TEST_TAG" \
            --jq '.assets[] | "\(.id)|\(.name)"')

          gh api --method PATCH "repos/$GITHUB_REPOSITORY/git/refs/tags/$TEST_TAG" \
            -f sha="$GITHUB_SHA" -F force=true >/dev/null
          actual_sha=$(gh api "repos/$GITHUB_REPOSITORY/git/ref/tags/$TEST_TAG" --jq '.object.sha')
          test "$actual_sha" = "$GITHUB_SHA"
