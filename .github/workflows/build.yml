name: Build SPD Mod

env:
  GIT_AUTHOR_NAME: edward9s
  GIT_AUTHOR_EMAIL: 277983297+edward9s@users.noreply.github.com
  GIT_COMMITTER_NAME: edward9s
  GIT_COMMITTER_EMAIL: 277983297+edward9s@users.noreply.github.com

on:
  workflow_dispatch:
  schedule:
    - cron: '0 18 * * *' # 台灣時間凌晨 2 點 (UTC18:00)

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      copilot-requests: write

    steps:
      - name: Checkout Mod Source
        uses: actions/checkout@v4
        with:
          path: mod
          fetch-depth: 0

      - name: Configure Git identity
        run: |
          git config --global user.name "$GIT_AUTHOR_NAME"
          git config --global user.email "$GIT_AUTHOR_EMAIL"

      - name: Check Version & Release Status
        id: check
        run: |
          REPO="00-Evan/shattered-pixel-dungeon"
          UPSTREAM_TAG=$(curl -s https://api.github.com/repos/$REPO/releases/latest | grep '"tag_name":' | sed -E 's/.*"([^"]+)".*/\1/')
          MOD_VER=$(python mod/scripts/extract_version.py mod/core/src/main/java/com/spd/mod/ModGame.java)
          EXPECTED_TAG="SPD-${UPSTREAM_TAG}-m${MOD_VER}"
          
          STATUS=$(curl -s -o /dev/null -w "%{http_code}" https://api.github.com/repos/${{ github.repository }}/releases/tags/$EXPECTED_TAG)
          
          if [ "$STATUS" == "200" ] && [ "${{ github.event_name }}" == "schedule" ]; then
            echo "Release $EXPECTED_TAG exists. Skipping scheduled build."
            echo "skip=true" >> $GITHUB_OUTPUT
          else
            echo "Proceeding with build for $EXPECTED_TAG"
            echo "skip=false" >> $GITHUB_OUTPUT
            echo "UPSTREAM_TAG=$UPSTREAM_TAG" >> $GITHUB_ENV
            echo "MOD_VER=$MOD_VER" >> $GITHUB_ENV
            echo "EXPECTED_TAG=$EXPECTED_TAG" >> $GITHUB_ENV
          fi

      - name: Prepare Release Notes Context
        if: steps.check.outputs.skip == 'false' && github.event_name == 'schedule'
        working-directory: ./mod
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          PREV_TAG=$(gh api repos/${{ github.repository }}/releases/latest --jq '.tag_name' 2>/dev/null || true)

          echo "PREV_TAG=$PREV_TAG" >> $GITHUB_ENV

          if [ -z "$PREV_TAG" ]; then
            echo "PREV_SPD=" >> $GITHUB_ENV
            echo "SPD_CHANGED=true" >> $GITHUB_ENV
            echo "HAS_SMM_COMMITS=false" >> $GITHUB_ENV
            exit 0
          fi

          PREV_BODY="${PREV_TAG#SPD-}"
          PREV_SPD="${PREV_BODY%-m*}"
          echo "PREV_SPD=$PREV_SPD" >> $GITHUB_ENV

          if [ "$PREV_SPD" != "$UPSTREAM_TAG" ]; then
            echo "SPD_CHANGED=true" >> $GITHUB_ENV
          else
            echo "SPD_CHANGED=false" >> $GITHUB_ENV
          fi

          if git rev-parse --verify "$PREV_TAG^{commit}" >/dev/null 2>&1 && \
             [ -n "$(git rev-list "$PREV_TAG"..HEAD)" ]; then
            echo "HAS_SMM_COMMITS=true" >> $GITHUB_ENV
          else
            echo "HAS_SMM_COMMITS=false" >> $GITHUB_ENV
          fi

      - name: Set Up Node.js for Copilot
        if: steps.check.outputs.skip == 'false' && github.event_name == 'schedule' && env.HAS_SMM_COMMITS == 'true'
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install Copilot CLI
        if: steps.check.outputs.skip == 'false' && github.event_name == 'schedule' && env.HAS_SMM_COMMITS == 'true'
        run: npm install -g @github/copilot

      - name: Generate SMM Changelog with Copilot
        if: steps.check.outputs.skip == 'false' && github.event_name == 'schedule' && env.HAS_SMM_COMMITS == 'true'
        continue-on-error: true
        working-directory: ./mod
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          rm -f release-notes-ai.md

          copilot -p "Generate a concise player-facing changelog for Shattered Master Mode by comparing git tag ${PREV_TAG} to HEAD.

          Use git log and git diff to inspect the actual final changes.

          Rules:
          - Describe only meaningful user-visible Shattered Master Mode changes.
          - Merge related commits into one bullet and describe the final behavior, not intermediate implementation steps.
          - Ignore version bumps, CI/build/release workflow changes, refactors, cleanup, formatting, tests, and reverted or superseded changes unless they alter player-visible behavior.
          - Do not mention Shattered Pixel Dungeon upstream version changes; the workflow handles those separately.
          - Do not invent changes or infer features not supported by the diff.
          - Use concise English suitable for GitHub release notes.
          - Use at most 6 Markdown bullet points, with no heading, preamble, links, or trailing commentary.
          - If there are no meaningful user-visible changes, write exactly: NO_USER_FACING_CHANGES
          - Write only the final result to release-notes-ai.md in the current directory." \
            --allow-tool='shell(git:*)' \
            --allow-tool=write \
            --no-ask-user

          test -s release-notes-ai.md

      - name: Compose Release Notes
        if: steps.check.outputs.skip == 'false' && github.event_name == 'schedule'
        working-directory: ./mod
        run: |
          CHANGES_FILE="../release-notes-changes.md"
          NOTES_FILE="../release-notes.md"
          : > "$CHANGES_FILE"

          if [ -z "$PREV_TAG" ]; then
            echo "- Built against Shattered Pixel Dungeon ${UPSTREAM_TAG}." >> "$CHANGES_FILE"
          elif [ "$SPD_CHANGED" == "true" ]; then
            echo "- Updated base game from Shattered Pixel Dungeon ${PREV_SPD} to ${UPSTREAM_TAG}." >> "$CHANGES_FILE"
          fi

          if [ "$HAS_SMM_COMMITS" == "true" ]; then
            if [ -s release-notes-ai.md ]; then
              AI_NOTES=$(cat release-notes-ai.md)
              if [ "$AI_NOTES" != "NO_USER_FACING_CHANGES" ]; then
                cat release-notes-ai.md >> "$CHANGES_FILE"
                echo >> "$CHANGES_FILE"
              fi
            else
              echo "- Shattered Master Mode changes are included; see the commit history since ${PREV_TAG} for details." >> "$CHANGES_FILE"
            fi
          fi

          if [ ! -s "$CHANGES_FILE" ]; then
            echo "- Maintenance release with no user-facing gameplay changes." >> "$CHANGES_FILE"
          fi

          {
            echo "## Changes"
            echo
            cat "$CHANGES_FILE"
            echo
            echo "> Automatically built from Shattered Pixel Dungeon ${UPSTREAM_TAG}."
          } > "$NOTES_FILE"

          cat "$NOTES_FILE"

      - name: Checkout SPD Source
        uses: actions/checkout@v4
        if: steps.check.outputs.skip == 'false'
        with:
          repository: 00-Evan/shattered-pixel-dungeon
          ref: ${{ env.UPSTREAM_TAG }}
          path: spd_src

      - uses: actions/setup-java@v4
        if: steps.check.outputs.skip == 'false'
        with:
          distribution: 'temurin'
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v3
        if: steps.check.outputs.skip == 'false'

      - name: Patch & Merge
        if: steps.check.outputs.skip == 'false'
        run: |
          python mod/scripts/patch_android.py
          python mod/scripts/inject_mod.py spd_src/core/src/main/java/com/shatteredpixel/shatteredpixeldungeon/windows/WndGame.java
          
          cp -a mod/core spd_src/ 2>/dev/null || true
          cp -a mod/android spd_src/ 2>/dev/null || true
          cp -a mod/desktop spd_src/ 2>/dev/null || true
          cp -a mod/assets spd_src/ 2>/dev/null || true
          
          python mod/scripts/patch_depth.py 26

      - name: Compile
        if: steps.check.outputs.skip == 'false'
        working-directory: ./spd_src
        run: |
          chmod +x ./gradlew
          # Release stays unchanged for the normal playable build. Full APK
          # injection uses the non-minified debug APK as its donor so R8 cannot
          # outline com.spd.mod code into donor-only obfuscated helper classes.
          ./gradlew android:assembleRelease android:assembleDebug :desktop:release

      - name: Install Old Build Tools for Signer
        if: steps.check.outputs.skip == 'false'
        run: $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager "build-tools;29.0.3"

      - name: Sign Android
        if: steps.check.outputs.skip == 'false'
        uses: r0adkll/sign-android-release@v1
        id: sign
        with:
          releaseDirectory: spd_src/android/build/outputs/apk/release
          signingKeyBase64: ${{ secrets.KEYSTORE_BASE64 }}
          alias: ${{ secrets.KEY_ALIAS }}
          keyStorePassword: ${{ secrets.STORE_PASSWORD }}
          keyPassword: ${{ secrets.KEY_PASSWORD }}

      - name: Package
        if: steps.check.outputs.skip == 'false'
        run: |
          python mod/scripts/package_release.py \
            "${{ env.UPSTREAM_TAG }}" \
            "${{ env.MOD_VER }}" \
            "${{ steps.sign.outputs.signedReleaseFile }}"

      - name: Package Full Injection Kit
        if: steps.check.outputs.skip == 'false'
        run: |
          DONOR_APK=$(find spd_src/android/build/outputs/apk/debug -name '*.apk' | head -1)
          DONOR_JAR=$(find spd_src/desktop/build/libs -name '*.jar' | head -1)
          test -n "$DONOR_APK" -a -f "$DONOR_APK"
          test -n "$DONOR_JAR" -a -f "$DONOR_JAR"

          KIT_DIR="inject-kit"
          rm -rf "$KIT_DIR"
          mkdir -p "$KIT_DIR"

          cp "$DONOR_APK" "$KIT_DIR/SMM-${UPSTREAM_TAG}-m${MOD_VER}-inject-donor.apk"
          cp "$DONOR_JAR" "$KIT_DIR/SMM-${UPSTREAM_TAG}-m${MOD_VER}-inject-donor.jar"
          cp mod/scripts/inject_smm_apk.py "$KIT_DIR/"
          cp mod/scripts/inject_apk.py "$KIT_DIR/"
          cp mod/scripts/inject_smm_jar.py "$KIT_DIR/"
          cp mod/scripts/inject_jar.py "$KIT_DIR/"
          cp mod/docs/modankh_payload_rules.md "$KIT_DIR/"

          cat > "$KIT_DIR/README.txt" <<EOF
          Shattered Master Mode full injection kit

          APK:
            python inject_smm_apk.py SMM-${UPSTREAM_TAG}-m${MOD_VER}-inject-donor.apk TARGET.apk --out TARGET-SMM.apk

          Desktop JAR:
            python inject_smm_jar.py SMM-${UPSTREAM_TAG}-m${MOD_VER}-inject-donor.jar TARGET.jar --out TARGET-SMM.jar

          The APK donor is intentionally the non-minified GitHub Actions debug build.
          Do not replace it with the release APK: release R8 optimization may create
          donor-only obfuscated helper classes that are unsafe to transplant.

          The target game remains the base. Full SMM injection patches the target
          WndGame menu entry and injects com.spd.mod; it does not give the Hero a
          startup ModAnkh.
          EOF

          (cd "$KIT_DIR" && zip -q -r "../out/SMM-${UPSTREAM_TAG}-m${MOD_VER}-InjectKit.zip" .)

      - name: Upload Artifacts (Manual Only)
        if: steps.check.outputs.skip == 'false' && github.event_name == 'workflow_dispatch'
        uses: actions/upload-artifact@v4
        with:
          name: Release-${{ env.EXPECTED_TAG }}
          path: out/*

      - name: Create Release (Schedule Only)
        if: steps.check.outputs.skip == 'false' && github.event_name == 'schedule'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ env.EXPECTED_TAG }}
          name: ${{ env.EXPECTED_TAG }}
          body_path: release-notes.md
          files: out/*
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
