name: Build SMM

env:
  GIT_AUTHOR_NAME: edward9s
  GIT_AUTHOR_EMAIL: 277983297+edward9s@users.noreply.github.com
  GIT_COMMITTER_NAME: edward9s
  GIT_COMMITTER_EMAIL: 277983297+edward9s@users.noreply.github.com

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: Checkout Mod Source
        uses: actions/checkout@v4
        with:
          path: mod
          fetch-depth: 0

      - name: Configure Git identity
        run: |
          git config --global user.name "$GIT_AUTHOR_NAME"
          git config --global user.email "$GIT_AUTHOR_EMAIL"

      - name: Check Version & Release Status
        id: check
        run: |
          REPO="00-Evan/shattered-pixel-dungeon"
          UPSTREAM_TAG=$(curl -s https://api.github.com/repos/$REPO/releases/latest | grep '"tag_name":' | sed -E 's/.*"([^"]+)".*/\1/')
          MOD_VER=$(python mod/scripts/extract_version.py mod/core/src/main/java/com/spd/mod/ModGame.java)
          EXPECTED_TAG="SPD-${UPSTREAM_TAG}-m${MOD_VER}"
          
          STATUS=$(curl -s -o /dev/null -w "%{http_code}" https://api.github.com/repos/${{ github.repository }}/releases/tags/$EXPECTED_TAG)
          
          if [ "$STATUS" == "200" ] && [ "${{ github.event_name }}" == "schedule" ]; then
            echo "Release $EXPECTED_TAG exists. Skipping scheduled build."
            echo "skip=true" >> $GITHUB_OUTPUT
          else
            echo "Proceeding with build for $EXPECTED_TAG"
            echo "skip=false" >> $GITHUB_OUTPUT
            echo "UPSTREAM_TAG=$UPSTREAM_TAG" >> $GITHUB_ENV
            echo "MOD_VER=$MOD_VER" >> $GITHUB_ENV
            echo "EXPECTED_TAG=$EXPECTED_TAG" >> $GITHUB_ENV
          fi

      - name: Checkout SPD Source
        uses: actions/checkout@v4
        if: steps.check.outputs.skip == 'false'
        with:
          repository: 00-Evan/shattered-pixel-dungeon
          ref: ${{ env.UPSTREAM_TAG }}
          path: spd_src

      - uses: actions/setup-java@v4
        if: steps.check.outputs.skip == 'false'
        with:
          distribution: 'temurin'
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v3
        if: steps.check.outputs.skip == 'false'

      - name: Patch & Merge
        if: steps.check.outputs.skip == 'false'
        run: |
          python mod/scripts/patch_android.py
          python mod/scripts/inject_mod.py spd_src/core/src/main/java/com/shatteredpixel/shatteredpixeldungeon/windows/WndGame.java
          
          cp -a mod/core spd_src/ 2>/dev/null || true
          cp -a mod/android spd_src/ 2>/dev/null || true
          cp -a mod/desktop spd_src/ 2>/dev/null || true
          cp -a mod/assets spd_src/ 2>/dev/null || true
          
          python mod/scripts/patch_depth.py 26

      - name: Compile
        if: steps.check.outputs.skip == 'false'
        working-directory: ./spd_src
        run: |
          chmod +x ./gradlew
          # Release stays unchanged for the normal playable build. Full APK
          # injection uses the non-minified debug APK as its donor so R8 cannot
          # outline com.spd.mod code into donor-only obfuscated helper classes.
          ./gradlew android:assembleRelease android:assembleDebug :desktop:release

      - name: Install Old Build Tools for Signer
        if: steps.check.outputs.skip == 'false'
        run: $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager "build-tools;29.0.3"

      - name: Sign Android
        if: steps.check.outputs.skip == 'false'
        uses: r0adkll/sign-android-release@v1
        id: sign
        with:
          releaseDirectory: spd_src/android/build/outputs/apk/release
          signingKeyBase64: ${{ secrets.KEYSTORE_BASE64 }}
          alias: ${{ secrets.KEY_ALIAS }}
          keyStorePassword: ${{ secrets.STORE_PASSWORD }}
          keyPassword: ${{ secrets.KEY_PASSWORD }}

      - name: Package
        if: steps.check.outputs.skip == 'false'
        run: |
          python mod/scripts/package_release.py \
            "${{ env.UPSTREAM_TAG }}" \
            "${{ env.MOD_VER }}" \
            "${{ steps.sign.outputs.signedReleaseFile }}"

      - name: Package Full Injection Kit
        if: steps.check.outputs.skip == 'false'
        run: |
          DONOR_APK=$(find spd_src/android/build/outputs/apk/debug -name '*.apk' | head -1)
          DONOR_JAR=$(find spd_src/desktop/build/libs -name '*.jar' | head -1)
          test -n "$DONOR_APK" -a -f "$DONOR_APK"
          test -n "$DONOR_JAR" -a -f "$DONOR_JAR"
          python mod/scripts/package_inject_kit.py \
            "$DONOR_APK" "$DONOR_JAR" "inject-kit" \
            --repo-root mod

      - name: Upload Build Artifacts
        if: steps.check.outputs.skip == 'false'
        uses: actions/upload-artifact@v4
        with:
          retention-days: 7
          name: Release-${{ env.EXPECTED_TAG }}
          path: out/*

      - name: Upload Injection Kit
        if: steps.check.outputs.skip == 'false'
        uses: actions/upload-artifact@v4
        with:
          retention-days: 7
          name: SMM-m${{ env.MOD_VER }}-InjectKit
          path: inject-kit/*
          if-no-files-found: error

