name: one-shot-enchant-debug

on:
  push:
    paths:
      - '.github/workflows/one-shot-enchant-debug.yml'

permissions:
  contents: write

env:
  GIT_AUTHOR_NAME: edward9s
  GIT_AUTHOR_EMAIL: 277983297+edward9s@users.noreply.github.com
  GIT_COMMITTER_NAME: edward9s
  GIT_COMMITTER_EMAIL: 277983297+edward9s@users.noreply.github.com

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Apply and validate patch
        run: |
          git config user.name "$GIT_AUTHOR_NAME"
          git config user.email "$GIT_AUTHOR_EMAIL"
          python .github/scripts/patch_enchant_debug.py
          grep -F 'case "enchant"' core/src/main/java/com/spd/mod/mechanics/ModDebug.java
          grep -F 'case "inscribe"' core/src/main/java/com/spd/mod/mechanics/ModDebug.java
          grep -F 'new:<Class>' core/src/main/java/com/spd/mod/mechanics/ModDebug.java
          grep -F 'applyEquipmentEffect' core/src/main/java/com/spd/mod/mechanics/ModDebug.java
          git diff --check
          git add core/src/main/java/com/spd/mod/mechanics/ModDebug.java
          git commit -m "Add debug enchantment and glyph commands"
          git push origin main
