name: one-shot-static-field-support

on:
  push:
    paths:
      - '.github/workflows/one-shot-static-field-support.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Patch static field support
        shell: python
        run: |
          from pathlib import Path

          def replace_once(text, old, new, label):
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f'{label}: expected one match, found {count}')
              return text.replace(old, new, 1)

          debug_path = Path('core/src/main/java/com/spd/mod/mechanics/ModDebug.java')
          text = debug_path.read_text(encoding='utf-8')

          text = replace_once(
              text,
              '''            case "get":\n                if (!args.isEmpty() && args.get(0).startsWith("@")) {\n                    stored = getObjectField(args);\n                    hasStoredResult = stored != null;\n                } else {\n                    ModValueSearch.get(args);\n                }\n                break;\n\n            case "set":\n                if (!args.isEmpty() && args.get(0).startsWith("@")) {\n                    setObjectField(args);\n                } else {\n                    ModValueSearch.set(args);\n                }\n                break;\n''',
              '''            case "get":\n                if (!args.isEmpty() && args.get(0).startsWith("@")) {\n                    stored = getObjectField(args);\n                    hasStoredResult = stored != null;\n                } else if (!args.isEmpty() && args.get(0).startsWith("#")) {\n                    ModValueSearch.get(args);\n                } else {\n                    stored = getStaticField(args);\n                    hasStoredResult = stored != null;\n                }\n                break;\n\n            case "set":\n                if (!args.isEmpty() && args.get(0).startsWith("@")) {\n                    setObjectField(args);\n                } else if (!args.isEmpty() && args.get(0).startsWith("#")) {\n                    ModValueSearch.set(args);\n                } else {\n                    setStaticField(args);\n                }\n                break;\n''',
              'ModDebug get/set switch')

          text = replace_once(
              text,
              '''                + "results [#id] | get #id | set #id <number> | clear\\n"\n                + "get @object <field> | set @object <field> <value>\\n"\n                + "@x get @object <field>  (store a non-null field value)\\n"\n''',
              '''                + "results [#id] | get #id | set #id <number> | clear\\n"\n                + "get @object <field> | set @object <field> <value>\\n"\n                + "get <Class> <staticField> | set <Class> <staticField> <value>\\n"\n                + "@x get @object <field>  (store a non-null field value)\\n"\n                + "@x get <Class> <staticField>  (store a non-null static value)\\n"\n''',
              'ModDebug help')

          text = replace_once(
              text,
              '''    private static void inspect(List<String> args)\n            throws Exception {\n''',
              '''    private static Object getStaticField(List<String> args)\n            throws Exception {\n\n        if (args.size() != 2) {\n            throw new IllegalArgumentException(\n                    "get <Class> <staticField>");\n        }\n\n        Class<?> type = resolveClass(args.get(0), Object.class);\n        if (type == null) {\n            throw new ClassNotFoundException(args.get(0));\n        }\n\n        Field field = findField(type, args.get(1));\n        if (field == null) {\n            throw new NoSuchFieldException(str(\n                    type.getName(), ".", args.get(1)));\n        }\n        if (!Modifier.isStatic(field.getModifiers())) {\n            throw new IllegalArgumentException(str(\n                    "Field is not static: ",\n                    type.getName(), ".", field.getName()));\n        }\n\n        Object value = field.get(null);\n        GLog.p(str(\n                type.getSimpleName(), ".", field.getName(),\n                " -> ", valueString(value)));\n        return value;\n    }\n\n    private static void setStaticField(List<String> args)\n            throws Exception {\n\n        if (args.size() != 3) {\n            throw new IllegalArgumentException(\n                    "set <Class> <staticField> <value>");\n        }\n\n        Class<?> type = resolveClass(args.get(0), Object.class);\n        if (type == null) {\n            throw new ClassNotFoundException(args.get(0));\n        }\n\n        Field field = findField(type, args.get(1));\n        if (field == null) {\n            throw new NoSuchFieldException(str(\n                    type.getName(), ".", args.get(1)));\n        }\n        if (!Modifier.isStatic(field.getModifiers())) {\n            throw new IllegalArgumentException(str(\n                    "Field is not static: ",\n                    type.getName(), ".", field.getName()));\n        }\n        if (Modifier.isFinal(field.getModifiers())) {\n            throw new IllegalArgumentException(str(\n                    "Static final field is read-only: ",\n                    type.getName(), ".", field.getName()));\n        }\n\n        Object value = convertArg(field.getType(), args.get(2));\n        if (value == BAD_ARG) {\n            throw new IllegalArgumentException(str(\n                    "Cannot assign ", args.get(2),\n                    " to ", field.getType().getName(),\n                    " field ", field.getName()));\n        }\n\n        field.set(null, value);\n        GLog.p(str(\n                type.getSimpleName(), ".", field.getName(),\n                " = ", valueString(field.get(null))));\n    }\n\n    private static void inspect(List<String> args)\n            throws Exception {\n''',
              'ModDebug static field methods')

          debug_path.write_text(text, encoding='utf-8')

          console_path = Path('core/src/main/java/com/spd/mod/mechanics/ModDebug$Console.java')
          text = console_path.read_text(encoding='utf-8')

          text = replace_once(
              text,
              '''        if (("get".equals(command) || "set".equals(command))\n                && tokens.size() > commandIndex + 2\n                && tokens.get(commandIndex + 1).startsWith("@")) {\n            TargetInfo target = targetInfo(tokens.get(commandIndex + 1));\n            int fieldIndex = commandIndex + 2;\n            Field field = resolveField(target.type, tokens.get(fieldIndex));\n            if (!field.getName().equals(tokens.get(fieldIndex))) {\n                announce("field", field.getName(), tokens.get(fieldIndex));\n                tokens.set(fieldIndex, field.getName());\n            }\n\n            if ("set".equals(command) && tokens.size() > fieldIndex + 1) {\n                tokens.set(\n                        fieldIndex + 1,\n                        rewriteNamedValue(field.getType(), tokens.get(fieldIndex + 1)));\n            }\n        }\n''',
              '''        if (("get".equals(command) || "set".equals(command))\n                && tokens.size() > commandIndex + 2) {\n            String targetToken = tokens.get(commandIndex + 1);\n            if (!targetToken.startsWith("#")) {\n                Class<?> fieldType = targetToken.startsWith("@")\n                        ? targetInfo(targetToken).type\n                        : commandClass;\n                if (fieldType != null) {\n                    int fieldIndex = commandIndex + 2;\n                    Field field = resolveField(fieldType, tokens.get(fieldIndex));\n                    if (!field.getName().equals(tokens.get(fieldIndex))) {\n                        announce("field", field.getName(), tokens.get(fieldIndex));\n                        tokens.set(fieldIndex, field.getName());\n                    }\n\n                    if ("set".equals(command) && tokens.size() > fieldIndex + 1) {\n                        tokens.set(\n                                fieldIndex + 1,\n                                rewriteNamedValue(\n                                        field.getType(), tokens.get(fieldIndex + 1)));\n                    }\n                }\n            }\n        }\n''',
              'Console get/set preprocessing')

          text = replace_once(
              text,
              '''        } else if ("inspect".equals(command) || "use".equals(command)) {\n            String target = tokens.get(classIndex);\n            if (target.startsWith("@")\n                    || "hero".equalsIgnoreCase(target)\n                    || "level".equalsIgnoreCase(target)) {\n                return targetInfo(target).type;\n            }\n            label = "Class";\n            parent = Object.class;\n        } else {\n            return null;\n        }\n''',
              '''        } else if ("get".equals(command) || "set".equals(command)) {\n            String target = tokens.get(classIndex);\n            if (target.startsWith("@")) {\n                return targetInfo(target).type;\n            }\n            if (target.startsWith("#")) {\n                return null;\n            }\n            label = "Class";\n            parent = Object.class;\n        } else if ("inspect".equals(command) || "use".equals(command)) {\n            String target = tokens.get(classIndex);\n            if (target.startsWith("@")\n                    || "hero".equalsIgnoreCase(target)\n                    || "level".equalsIgnoreCase(target)) {\n                return targetInfo(target).type;\n            }\n            label = "Class";\n            parent = Object.class;\n        } else {\n            return null;\n        }\n''',
              'Console class resolution')

          console_path.write_text(text, encoding='utf-8')

      - name: Commit patch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add core/src/main/java/com/spd/mod/mechanics/ModDebug.java 'core/src/main/java/com/spd/mod/mechanics/ModDebug$Console.java'
          git diff --cached --check
          git commit -m "Support static field get and set in debug console"
          git push origin HEAD:main
