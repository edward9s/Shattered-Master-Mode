name: one-shot-remove-spawn-place-flag

on:
  push:
    paths:
      - '.github/workflows/one-shot-remove-spawn-place-flag.yml'

permissions:
  contents: write

env:
  GIT_AUTHOR_NAME: edward9s
  GIT_AUTHOR_EMAIL: 277983297+edward9s@users.noreply.github.com
  GIT_COMMITTER_NAME: edward9s
  GIT_COMMITTER_EMAIL: 277983297+edward9s@users.noreply.github.com

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Remove obsolete spawn placement flag
        run: |
          git config user.name "$GIT_AUTHOR_NAME"
          git config user.email "$GIT_AUTHOR_EMAIL"
          python .github/scripts/patch_remove_spawn_place_flag.py
          grep -F 'xquantity, including x1, uses non-interactive automatic placement.' core/src/main/java/com/spd/mod/mechanics/ModDebug.java
          grep -F 'spawn Rat x1' docs/debug_console.md
          grep -F 'spawn Rat x1' docs/debug_console.zh-TW.md
          ! grep -F -- '"-p".equalsIgnoreCase(token)' core/src/main/java/com/spd/mod/mechanics/ModDebug.java
          ! grep -F -- '"--place".equalsIgnoreCase(token)' core/src/main/java/com/spd/mod/mechanics/ModDebug.java
          ! grep -F -- '"-p".equalsIgnoreCase(token)' 'core/src/main/java/com/spd/mod/mechanics/ModDebug$Console.java'
          ! grep -F -- '"--place".equalsIgnoreCase(token)' 'core/src/main/java/com/spd/mod/mechanics/ModDebug$Console.java'
          ! grep -F -- '`-p` / `--place`' docs/debug_console.md
          ! grep -F -- '`-p` / `--place`' docs/debug_console.zh-TW.md
          git diff --check
          git add core/src/main/java/com/spd/mod/mechanics/ModDebug.java 'core/src/main/java/com/spd/mod/mechanics/ModDebug$Console.java' docs/debug_console.md docs/debug_console.zh-TW.md
          git commit -m "Remove obsolete spawn placement flag"
          git push origin main
