name: one-shot-repeat-docs

on:
  push:
    paths:
      - '.github/workflows/one-shot-repeat-docs.yml'

permissions:
  contents: write

env:
  GIT_AUTHOR_NAME: edward9s
  GIT_AUTHOR_EMAIL: 277983297+edward9s@users.noreply.github.com
  GIT_COMMITTER_NAME: edward9s
  GIT_COMMITTER_EMAIL: 277983297+edward9s@users.noreply.github.com

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Add repeat command and update docs
        run: |
          git config user.name "$GIT_AUTHOR_NAME"
          git config user.email "$GIT_AUTHOR_EMAIL"
          python .github/scripts/patch_repeat_docs.py
          grep -F 'case "repeat"' core/src/main/java/com/spd/mod/mechanics/ModDebug.java
          grep -F 'repeat <count> <command...>' core/src/main/java/com/spd/mod/mechanics/ModDebug.java docs/debug_console.md docs/debug_console.zh-TW.md
          grep -F 'return tokens.size() < 3;' core/src/main/java/com/spd/mod/mechanics/ModDebug.java
          grep -F 'Blob.seed(cell, amount, class)' docs/debug_console.md docs/debug_console.zh-TW.md
          git diff --check
          git add core/src/main/java/com/spd/mod/mechanics/ModDebug.java docs/debug_console.md docs/debug_console.zh-TW.md
          git commit -m "Add repeat debug command and docs"
          git push origin main
