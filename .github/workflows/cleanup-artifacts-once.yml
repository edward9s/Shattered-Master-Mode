name: Cleanup Actions artifacts once

on:
  push:
    paths:
      - ".github/workflows/cleanup-artifacts-once.yml"

permissions:
  contents: read
  actions: write

jobs:
  cleanup:
    runs-on: ubuntu-latest
    steps:
      - name: Delete existing Actions artifacts
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh api --paginate "repos/${{ github.repository }}/actions/artifacts?per_page=100" \
            --jq '.artifacts[].id' |
          while read -r artifact_id; do
            test -n "$artifact_id"
            gh api -X DELETE "repos/${{ github.repository }}/actions/artifacts/$artifact_id"
          done
