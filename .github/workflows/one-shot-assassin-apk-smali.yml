name: one-shot-assassin-apk-smali

on:
  push:
    paths:
      - '.github/workflows/one-shot-assassin-apk-smali.yml'

permissions:
  contents: read

env:
  GIT_AUTHOR_NAME: edward9s
  GIT_AUTHOR_EMAIL: 277983297+edward9s@users.noreply.github.com

jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v3
      - uses: actions/checkout@v4
        with:
          repository: 00-Evan/shattered-pixel-dungeon
          ref: v3.3.8
          path: spd_src
      - name: Build fresh release donor
        run: |
          python scripts/patch_android.py
          python scripts/inject_mod.py spd_src/core/src/main/java/com/shatteredpixel/shatteredpixeldungeon/windows/WndGame.java
          cp -a core spd_src/
          cp -a android spd_src/ 2>/dev/null || true
          cp -a assets spd_src/ 2>/dev/null || true
          chmod +x spd_src/gradlew
          (cd spd_src && ./gradlew android:assembleRelease)
          DONOR_APK=$(find spd_src/android/build/outputs/apk/release -name '*.apk' | head -n1)
          test -f "$DONOR_APK"
          echo "DONOR_APK=$DONOR_APK" >> "$GITHUB_ENV"
      - name: Verify release Assassin bytecode is injection-safe
        run: |
          curl -fL https://github.com/iBotPeaches/Apktool/releases/download/v3.0.3/apktool_3.0.3.jar -o /tmp/apktool.jar
          java -jar /tmp/apktool.jar d -f -r -o /tmp/donor "$DONOR_APK"
          FLASH=$(find /tmp/donor -path '*/com/spd/mod/mechanics/ModFlash.smali' -print -quit)
          test -n "$FLASH"
          grep -F 'Lcom/watabou/utils/SparseArray;->get(ILjava/lang/Object;)Ljava/lang/Object;' "$FLASH"
          ! grep -E 'invoke-[^ ]+ .*}, L[a-z][a-z0-9]{0,3};->' "$FLASH"
          for path in $(find /tmp/donor -path '*/com/spd/mod/mechanics/ModAssassin*.smali' -o -path '*/com/spd/mod/mechanics/ModFlash*.smali' | sort); do
            if grep -E 'invoke-[^ ]+ .*}, L[a-z][a-z0-9]{0,3};->' "$path"; then
              echo "Opaque R8 method owner remains in ${path##*/}" >&2
              exit 1
            fi
          done
      - name: Download clean APK targets
        run: |
          curl -fL https://github.com/00-Evan/shattered-pixel-dungeon/releases/download/v3.3.8/ShatteredPD-v3.3.8-Android.apk -o /tmp/spd.apk
          curl -fL https://github.com/TrashboxBobylev/Rat-King-Adventure/releases/download/2.3.3/android-release.apk -o /tmp/rka.apk
          unzip -t /tmp/spd.apk >/dev/null
          unzip -t /tmp/rka.apk >/dev/null
      - name: Validate official SPD injection
        run: |
          python scripts/inject_apk.py "$DONOR_APK" /tmp/spd.apk --out /tmp/spd-injected.apk | tee /tmp/spd.log
          grep -F 'Debug payload target API check: OK' /tmp/spd.log
          grep -F 'Injected: ModAnkh + ModAnkhStore + debug/Assassin payload' /tmp/spd.log
      - name: Validate Rat King injection
        run: |
          python scripts/inject_apk.py "$DONOR_APK" /tmp/rka.apk --out /tmp/rka-injected.apk | tee /tmp/rka.log
          grep -F 'Target SPD-family package: com.zrp200.rkpd2' /tmp/rka.log
          grep -F 'Debug payload target API check: OK' /tmp/rka.log
          grep -F 'Injected: ModAnkh + ModAnkhStore + debug/Assassin payload' /tmp/rka.log
