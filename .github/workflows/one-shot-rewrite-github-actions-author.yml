name: one-shot-rewrite-github-actions-author

on:
  push:
    paths:
      - '.github/workflows/one-shot-rewrite-github-actions-author.yml'

permissions:
  contents: write

jobs:
  rewrite:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Rewrite github-actions bot identity on main
        env:
          FILTER_BRANCH_SQUELCH_WARNING: '1'
        run: |
          git config user.name "edward9s"
          git config user.email "277983297+edward9s@users.noreply.github.com"

          git filter-branch --force --env-filter '
          if [ "$GIT_AUTHOR_NAME" = "github-actions[bot]" ] || [ "$GIT_AUTHOR_EMAIL" = "41898282+github-actions[bot]@users.noreply.github.com" ]; then
              export GIT_AUTHOR_NAME="edward9s"
              export GIT_AUTHOR_EMAIL="277983297+edward9s@users.noreply.github.com"
          fi
          if [ "$GIT_COMMITTER_NAME" = "github-actions[bot]" ] || [ "$GIT_COMMITTER_EMAIL" = "41898282+github-actions[bot]@users.noreply.github.com" ]; then
              export GIT_COMMITTER_NAME="edward9s"
              export GIT_COMMITTER_EMAIL="277983297+edward9s@users.noreply.github.com"
          fi
          ' -- main

          if git log main --format='%an <%ae> | %cn <%ce>' | grep -F 'github-actions[bot]'; then
              echo 'github-actions bot identity still exists on main' >&2
              exit 1
          fi

          git push --force origin main
