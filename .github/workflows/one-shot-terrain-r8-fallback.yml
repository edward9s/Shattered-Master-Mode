name: one-shot-terrain-r8-fallback

on:
  push:
    paths:
      - '.github/workflows/one-shot-terrain-r8-fallback.yml'

permissions:
  contents: write

env:
  GIT_AUTHOR_NAME: edward9s
  GIT_AUTHOR_EMAIL: 277983297+edward9s@users.noreply.github.com
  GIT_COMMITTER_NAME: edward9s
  GIT_COMMITTER_EMAIL: 277983297+edward9s@users.noreply.github.com

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Add R8-safe terrain fallback
        run: |
          git config user.name "$GIT_AUTHOR_NAME"
          git config user.email "$GIT_AUTHOR_EMAIL"
          python .github/scripts/patch_terrain_r8_fallback.py
          python -m py_compile scripts/patch_android.py
          grep -F 'putTerrainFallback(values, "CHASM", 0);' core/src/main/java/com/spd/mod/mechanics/ModDebug.java
          grep -F 'putTerrainFallback(values, "CRYSTAL_DOOR", 31);' core/src/main/java/com/spd/mod/mechanics/ModDebug.java
          grep -F 'canonical Terrain ID' docs/debug_console.md
          grep -F 'canonical ID' docs/debug_console.zh-TW.md
          grep -F -- '-keepclassmembers class com.shatteredpixel.shatteredpixeldungeon.levels.Terrain { public static final int *; }' scripts/patch_android.py
          git diff --check
          git add core/src/main/java/com/spd/mod/mechanics/ModDebug.java docs/debug_console.md docs/debug_console.zh-TW.md
          git commit -m "Make terrain debug lookup R8-safe"
          git push origin main
