name: one-shot-special-mob-init

on:
  push:
    paths:
      - '.github/workflows/one-shot-special-mob-init.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Apply patch
        run: python scripts/one_shot_special_mob_init.py

      - name: Sanity check
        run: |
          grep -F 'initializeSpecialMobForDebug(mob);' core/src/main/java/com/spd/mod/mechanics/ModDebug.java
          grep -F 'Initialized debug Ghost quest' core/src/main/java/com/spd/mod/mechanics/ModDebug.java
          grep -F 'Initialized debug Wandmaker quest' core/src/main/java/com/spd/mod/mechanics/ModDebug.java
          grep -F 'Initialized debug Blacksmith rewards' core/src/main/java/com/spd/mod/mechanics/ModDebug.java
          grep -F 'Initialized debug Imp quest' core/src/main/java/com/spd/mod/mechanics/ModDebug.java
          grep -F 'Registered debug DemonSpawner' core/src/main/java/com/spd/mod/mechanics/ModDebug.java
          git diff --check

      - name: Commit patch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add core/src/main/java/com/spd/mod/mechanics/ModDebug.java
          git diff --cached --check
          git commit -m "Initialize special mobs spawned by debug console"
          git push origin HEAD:main
