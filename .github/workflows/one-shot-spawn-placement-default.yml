name: one-shot-spawn-placement-default

on:
  push:
    paths:
      - '.github/workflows/one-shot-spawn-placement-default.yml'

permissions:
  contents: write

env:
  GIT_AUTHOR_NAME: edward9s
  GIT_AUTHOR_EMAIL: 277983297+edward9s@users.noreply.github.com
  GIT_COMMITTER_NAME: edward9s
  GIT_COMMITTER_EMAIL: 277983297+edward9s@users.noreply.github.com

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Make spawn placement-first
        run: |
          git config user.name "$GIT_AUTHOR_NAME"
          git config user.email "$GIT_AUTHOR_EMAIL"
          python .github/scripts/patch_spawn_placement_default.py
          grep -F 'spawn <Mob> [cell|@variable|xquantity] [method [args...]]' core/src/main/java/com/spd/mod/mechanics/ModDebug.java
          grep -F 'spawn Rat @cell' docs/debug_console.md
          grep -F 'spawn Rat @cell' docs/debug_console.zh-TW.md
          grep -F 'String placement = tokens.get(2);' core/src/main/java/com/spd/mod/mechanics/ModDebug.java
          grep -F 'token.startsWith("@")' 'core/src/main/java/com/spd/mod/mechanics/ModDebug$Console.java'
          git diff --check
          git add core/src/main/java/com/spd/mod/mechanics/ModDebug.java 'core/src/main/java/com/spd/mod/mechanics/ModDebug$Console.java' docs/debug_console.md docs/debug_console.zh-TW.md
          git commit -m "Make single mob spawn placement-first"
          git push origin main
