name: One-shot Mod item injector migration

on:
  push:
    branches: [ main ]
    paths:
      - '.github/workflows/one-shot-mod-items.yml'

permissions:
  contents: write

jobs:
  migrate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Apply controlled Mod item payload migration
        run: python .github/scripts/one_shot_mod_items.py

      - name: Validate injector Python
        run: |
          python -m py_compile scripts/inject_apk.py scripts/inject_jar.py scripts/patch_android.py
          git diff --check

      - name: Commit migration and remove one-shot files
        run: |
          git config user.name 'edward9s'
          git config user.email '277983297+edward9s@users.noreply.github.com'
          git rm .github/workflows/one-shot-mod-items.yml .github/scripts/one_shot_mod_items.py
          git add scripts/inject_apk.py scripts/inject_jar.py scripts/patch_android.py docs/modankh_payload_rules.md docs/modankh_payload_rules.zh-TW.md
          git diff --cached --check
          git commit --author='edward9s <277983297+edward9s@users.noreply.github.com>' -m 'Inject all controlled Mod items'
          git push origin HEAD:main
