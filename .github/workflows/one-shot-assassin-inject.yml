name: one-shot-assassin-inject

on:
  push:
    paths:
      - '.github/workflows/one-shot-assassin-inject.yml'

permissions:
  contents: write

env:
  GIT_AUTHOR_NAME: edward9s
  GIT_AUTHOR_EMAIL: 277983297+edward9s@users.noreply.github.com
  GIT_COMMITTER_NAME: edward9s
  GIT_COMMITTER_EMAIL: 277983297+edward9s@users.noreply.github.com

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v3

      - name: Apply Assassin injectable payload patch
        run: |
          git config user.name "$GIT_AUTHOR_NAME"
          git config user.email "$GIT_AUTHOR_EMAIL"
          python .github/scripts/patch_assassin_inject.py
          python -m py_compile scripts/inject_apk.py scripts/inject_jar.py scripts/patch_android.py
          grep -F 'MOD_ASSASSIN_BUFF' scripts/inject_apk.py
          grep -F 'MOD_ASSASSIN_BUFF_ENTRY' scripts/inject_jar.py
          grep -F 'ModAssassinBuff { *; }' scripts/patch_android.py
          grep -F 'affect ModAssassinBuff' core/src/main/java/com/spd/mod/mechanics/ModDebug.java
          grep -F 'affect ModAssassinBuff' docs/debug_console.md
          grep -F 'affect ModAssassinBuff' docs/debug_console.zh-TW.md
          git diff --check

      - name: Resolve current official SPD release
        run: |
          curl -fsSL https://api.github.com/repos/00-Evan/shattered-pixel-dungeon/releases/latest -o /tmp/spd-release.json
          TAG=$(jq -r '.tag_name' /tmp/spd-release.json)
          APK_URL=$(jq -r '.assets[] | select(.name | endswith("-Android.apk")) | .browser_download_url' /tmp/spd-release.json | head -n1)
          JAR_URL=$(jq -r '.assets[] | select(.name | endswith("-Java.jar")) | .browser_download_url' /tmp/spd-release.json | head -n1)
          test -n "$TAG" && test "$TAG" != null
          test -n "$APK_URL" && test "$APK_URL" != null
          test -n "$JAR_URL" && test "$JAR_URL" != null
          echo "SPD_TAG=$TAG" >> "$GITHUB_ENV"
          echo "SPD_APK_URL=$APK_URL" >> "$GITHUB_ENV"
          echo "SPD_JAR_URL=$JAR_URL" >> "$GITHUB_ENV"
          echo "Testing against $TAG"

      - name: Checkout matching SPD source
        uses: actions/checkout@v4
        with:
          repository: 00-Evan/shattered-pixel-dungeon
          ref: ${{ env.SPD_TAG }}
          path: spd_src

      - name: Build fresh donor APK and JAR
        run: |
          python scripts/patch_android.py
          python scripts/inject_mod.py spd_src/core/src/main/java/com/shatteredpixel/shatteredpixeldungeon/windows/WndGame.java
          cp -a core spd_src/
          cp -a android spd_src/ 2>/dev/null || true
          cp -a desktop spd_src/ 2>/dev/null || true
          cp -a assets spd_src/ 2>/dev/null || true
          python scripts/patch_depth.py 26
          chmod +x spd_src/gradlew
          (cd spd_src && ./gradlew android:assembleRelease :desktop:release)
          DONOR_APK=$(find spd_src/android/build/outputs/apk/release -name '*.apk' | head -n1)
          DONOR_JAR=$(find spd_src/desktop/build/libs -name 'desktop-*.jar' | head -n1)
          test -f "$DONOR_APK"
          test -f "$DONOR_JAR"
          echo "DONOR_APK=$DONOR_APK" >> "$GITHUB_ENV"
          echo "DONOR_JAR=$DONOR_JAR" >> "$GITHUB_ENV"

      - name: Download clean official targets
        run: |
          curl -fL "$SPD_APK_URL" -o /tmp/target.apk
          curl -fL "$SPD_JAR_URL" -o /tmp/target.jar
          unzip -t /tmp/target.apk >/dev/null
          unzip -t /tmp/target.jar >/dev/null

      - name: Inject fresh donor into clean APK and JAR
        run: |
          python scripts/inject_apk.py "$DONOR_APK" /tmp/target.apk --out /tmp/injected.apk
          python scripts/inject_jar.py "$DONOR_JAR" /tmp/target.jar --out /tmp/injected.jar

      - name: Verify Assassin payload is physically present
        run: |
          unzip -p /tmp/injected.apk classes.dex | strings | grep -F 'Lcom/spd/mod/mechanics/ModAssassinBuff;'
          unzip -p /tmp/injected.apk classes.dex | strings | grep -F 'Lcom/spd/mod/mechanics/ModAssassin;'
          unzip -p /tmp/injected.apk classes.dex | strings | grep -F 'Lcom/spd/mod/mechanics/ModFlash;'
          unzip -l /tmp/injected.jar | grep -F 'com/spd/mod/mechanics/ModAssassinBuff.class'
          unzip -l /tmp/injected.jar | grep -F 'com/spd/mod/mechanics/ModAssassin.class'
          unzip -l /tmp/injected.jar | grep -F 'com/spd/mod/mechanics/ModFlash.class'
          # ModDebug indexes com.spd.mod from Android DexFile, so affect can resolve the injected Buff.
          grep -F '"com.spd.mod"' core/src/main/java/com/spd/mod/mechanics/ModDebug.java
          grep -F 'names.add(className)' core/src/main/java/com/spd/mod/mechanics/ModDebug.java

      - name: Commit validated implementation
        run: |
          git add \
            scripts/inject_apk.py \
            scripts/inject_jar.py \
            scripts/patch_android.py \
            core/src/main/java/com/spd/mod/mechanics/ModDebug.java \
            docs/debug_console.md \
            docs/debug_console.zh-TW.md \
            docs/modankh_payload_rules.md \
            docs/modankh_payload_rules.zh-TW.md
          git diff --cached --check
          git commit -m 'Inject Assassin buff support with debug console'
          git push origin main
