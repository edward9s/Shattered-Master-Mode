name: Audit beta journal runtime member access

on:
  push:
    branches: [ main ]
    paths:
      - '.github/workflows/diagnose-beta-journal-access.yml'

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          path: mod
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v3

      - name: Build current donor against 3.3.8
        run: |
          git clone --depth 1 --branch v3.3.8 https://github.com/00-Evan/shattered-pixel-dungeon.git spd_src
          python mod/scripts/patch_android.py
          python mod/scripts/inject_mod.py spd_src/core/src/main/java/com/shatteredpixel/shatteredpixeldungeon/windows/WndGame.java
          cp -a mod/core spd_src/
          cp -a mod/android spd_src/ 2>/dev/null || true
          cp -a mod/assets spd_src/ 2>/dev/null || true
          python mod/scripts/patch_depth.py 26
          chmod +x spd_src/gradlew
          (cd spd_src && ./gradlew android:assembleDebug)
          DONOR=$(find spd_src/android/build/outputs/apk/debug -name '*.apk' | head -1)
          cp "$DONOR" donor.apk

      - name: Download binary APK baselines
        run: |
          curl -fL https://github.com/00-Evan/shattered-pixel-dungeon/releases/download/v3.3.8/ShatteredPD-v3.3.8-Android.apk -o spd338.apk
          curl -fL https://github.com/00-Evan/shattered-pixel-dungeon/releases/download/4.0.0-beta/ShatteredPD-v4.0.0-BETA-4-Android.apk -o spd4.apk

      - name: Decode DEX
        run: |
          python - <<'PY'
          import importlib.util, pathlib, sys
          spec = importlib.util.spec_from_file_location('inj', 'mod/scripts/_inject_apk_core.py')
          inj = importlib.util.module_from_spec(spec); sys.modules[spec.name] = inj; spec.loader.exec_module(inj)
          tc = inj.Toolchain(pathlib.Path('/tmp/smm-audit-cache'))
          apktool, java = tc.ensure_apktool()
          for apk, out in [('donor.apk','donor-dec'),('spd338.apk','t338'),('spd4.apk','t4')]:
              inj.run([java.java, '-jar', apktool, 'd', '-f', '-r', '-o', pathlib.Path(out), pathlib.Path(apk)])
          PY

      - name: Compare journal access violations
        run: |
          python - <<'PY'
          import importlib.util, pathlib, re, sys
          spec = importlib.util.spec_from_file_location('inj', 'mod/scripts/_inject_apk_core.py')
          inj = importlib.util.module_from_spec(spec); sys.modules[spec.name] = inj; spec.loader.exec_module(inj)

          donor = inj.index_smali(pathlib.Path('donor-dec'))
          t338 = inj.index_smali(pathlib.Path('t338'))
          t4 = inj.index_smali(pathlib.Path('t4'))
          payload = {d:c for d,c in donor.items() if d.startswith('Lcom/spd/mod/journal/')}

          def pkg(desc):
              return desc.rsplit('/',1)[0]

          def is_subclass(index, child, parent):
              seen=set()
              cur=child
              while cur and cur not in seen:
                  if cur == parent: return True
                  seen.add(cur)
                  item=index.get(cur) or donor.get(cur)
                  cur=item.superclass if item else None
              return False

          def access_ok(index, caller, owner, flags):
              if 'public' in flags: return True
              if 'private' in flags: return caller == owner
              if pkg(caller) == pkg(owner): return True
              if 'protected' in flags and is_subclass(index, caller, owner): return True
              return False

          def class_flags(item):
              m=re.search(r'(?m)^\.class\s+([^\n]+?)\s+L', item.text)
              return frozenset(m.group(1).split()) if m else frozenset()

          def audit(target):
              combined=dict(target); combined.update(payload)
              out=[]
              for caller,item in sorted(payload.items()):
                  for dep in inj.TYPE_INSN_RE.findall(item.text):
                      if not dep.startswith('Lcom/shatteredpixel/shatteredpixeldungeon/') or dep not in target:
                          continue
                      flags=class_flags(target[dep])
                      if 'public' not in flags and pkg(caller) != pkg(dep):
                          out.append(f'{caller}: inaccessible type {dep} flags={sorted(flags)}')
                  for _,owner,name,proto in inj.METHOD_INSN_RE.findall(item.text):
                      if not owner.startswith('Lcom/shatteredpixel/shatteredpixeldungeon/') or owner not in target:
                          continue
                      resolved=inj.resolve_member(combined, owner, (name,proto), method=True)
                      if resolved:
                          ro,flags=resolved
                          if not access_ok(combined, caller, ro, flags):
                              out.append(f'{caller}: inaccessible method {owner}->{name}{proto} resolved={ro} flags={sorted(flags)}')
                  for _,owner,name,typ in inj.FIELD_INSN_RE.findall(item.text):
                      if not owner.startswith('Lcom/shatteredpixel/shatteredpixeldungeon/') or owner not in target:
                          continue
                      resolved=inj.resolve_member(combined, owner, (name,typ), method=False)
                      if resolved:
                          ro,flags=resolved
                          if not access_ok(combined, caller, ro, flags):
                              out.append(f'{caller}: inaccessible field {owner}->{name}:{typ} resolved={ro} flags={sorted(flags)}')
              return sorted(set(out))

          a338=audit(t338); a4=audit(t4)
          print('===== 3.3.8 access findings =====')
          print('\n'.join(a338) if a338 else 'none')
          print('===== BETA-4 access findings =====')
          print('\n'.join(a4) if a4 else 'none')
          print('===== BETA-only access findings =====')
          only=sorted(set(a4)-set(a338))
          print('\n'.join(only) if only else 'none')
          PY
