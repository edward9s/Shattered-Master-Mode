name: One-shot Mod item R8 diagnosis

on:
  push:
    branches: [ main ]
    paths:
      - '.github/workflows/one-shot-mod-items-r8-diagnose.yml'

permissions:
  contents: write

env:
  GIT_AUTHOR_NAME: edward9s
  GIT_AUTHOR_EMAIL: 277983297+edward9s@users.noreply.github.com
  GIT_COMMITTER_NAME: edward9s
  GIT_COMMITTER_EMAIL: 277983297+edward9s@users.noreply.github.com

jobs:
  diagnose:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          path: mod
          fetch-depth: 0
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v3

      - name: Checkout current SPD
        run: |
          TAG=$(curl -fsSL https://api.github.com/repos/00-Evan/shattered-pixel-dungeon/releases/latest | python -c 'import json,sys; print(json.load(sys.stdin)["tag_name"])')
          echo "SPD_TAG=$TAG" >> "$GITHUB_ENV"
          git clone --depth 1 --branch "$TAG" https://github.com/00-Evan/shattered-pixel-dungeon.git spd_src

      - name: Build fresh release donor
        run: |
          python mod/scripts/patch_android.py
          python mod/scripts/inject_mod.py spd_src/core/src/main/java/com/shatteredpixel/shatteredpixeldungeon/windows/WndGame.java
          cp -a mod/core spd_src/
          cp -a mod/android spd_src/ 2>/dev/null || true
          cp -a mod/assets spd_src/ 2>/dev/null || true
          python mod/scripts/patch_depth.py 26
          chmod +x spd_src/gradlew
          (cd spd_src && ./gradlew android:assembleRelease)
          DONOR=$(find spd_src/android/build/outputs/apk/release -name '*.apk' | head -1)
          test -n "$DONOR"
          echo "DONOR=$DONOR" >> "$GITHUB_ENV"

      - name: Diagnose R8 dependency closure by Mod item root
        run: |
          cat > /tmp/diagnose.py <<'PY'
          import importlib.util, pathlib, subprocess, tempfile, collections
          spec = importlib.util.spec_from_file_location('inj', 'mod/scripts/inject_apk.py')
          inj = importlib.util.module_from_spec(spec); spec.loader.exec_module(inj)
          cache = pathlib.Path('/tmp/smm-inject-cache')
          tc = inj.Toolchain(cache)
          apktool, java = tc.ensure_apktool()
          with tempfile.TemporaryDirectory() as td:
              dec = pathlib.Path(td)/'donor'
              inj.run([java.java, '-jar', apktool, 'd', '-f', '-r', '-o', dec, pathlib.Path(__import__('os').environ['DONOR'])])
              idx = inj.index_smali(dec)
              roots = sorted(d for d in idx if (
                  (inj.is_mod_item_payload(d) and '$' not in d)
                  or d in {r for r,_ in inj.ITEM_HELPER_FAMILIES}
              ))
              allowed = inj.TARGET_API_PREFIXES
              all_explicit = {d for d in idx if inj.is_debug_root(d)}

              def bfs(root):
                  q = collections.deque([root]); prev={root:None}; edge={}
                  suspicious=[]
                  while q:
                      cur=q.popleft(); item=idx[cur]
                      for dep in sorted(inj.smali_dependencies(item)):
                          if dep.startswith(allowed):
                              continue
                          if dep not in idx:
                              suspicious.append((cur,dep,'MISSING'))
                              continue
                          if dep not in prev:
                              prev[dep]=cur; edge[dep]=(cur,dep); q.append(dep)
                          if dep not in all_explicit and not dep.startswith('Lcom/spd/mod/'):
                              suspicious.append((cur,dep,'DONOR_ONLY'))
                  return prev, suspicious

              print('=== ROOTS ===')
              for r in roots: print(r)
              print('=== SUSPICIOUS PATHS ===')
              for root in roots:
                  prev,sus=bfs(root)
                  seen=set()
                  for parent,dep,kind in sus:
                      if (dep,kind) in seen: continue
                      seen.add((dep,kind))
                      path=[dep]; x=parent
                      while x is not None:
                          path.append(x); x=prev.get(x)
                      path=list(reversed(path))
                      print(f'ROOT {root} {kind}: ' + ' -> '.join(path))

              print('=== REBOUND LIBGDX REFS FROM NON-TARGET DONOR CLASSES ===')
              for desc,item in sorted(idx.items()):
                  if desc.startswith(allowed) or desc.startswith('Lcom/spd/mod/'):
                      continue
                  refs=[]
                  for _,owner,name,proto in inj.METHOD_INSN_RE.findall(item.text):
                      if owner.startswith('Lcom/badlogic/') and any(c not in idx or (not c.startswith(allowed) and not c.startswith('Ljava/')) for c in inj.descriptor_classes(proto)):
                          refs.append(f'{owner}->{name}{proto}')
                  for _,owner,name,typ in inj.FIELD_INSN_RE.findall(item.text):
                      if owner.startswith('Lcom/badlogic/') and any(c not in idx or (not c.startswith(allowed) and not c.startswith('Ljava/')) for c in inj.descriptor_classes(typ)):
                          refs.append(f'{owner}->{name}:{typ}')
                  if refs:
                      print(desc)
                      for r in sorted(set(refs)): print('  '+r)
          PY
          python /tmp/diagnose.py

      - name: Remove one-shot workflow
        if: always()
        working-directory: mod
        run: |
          git config user.name "$GIT_AUTHOR_NAME"
          git config user.email "$GIT_AUTHOR_EMAIL"
          git pull --ff-only origin main
          git rm .github/workflows/one-shot-mod-items-r8-diagnose.yml
          git commit -m "Remove temporary Mod item R8 diagnosis workflow"
          git push origin main
