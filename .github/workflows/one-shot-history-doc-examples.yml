name: one-shot-history-doc-examples

on:
  push:
    paths:
      - '.github/workflows/one-shot-history-doc-examples.yml'

permissions:
  contents: write

env:
  GIT_AUTHOR_NAME: edward9s
  GIT_AUTHOR_EMAIL: 277983297+edward9s@users.noreply.github.com
  GIT_COMMITTER_NAME: edward9s
  GIT_COMMITTER_EMAIL: 277983297+edward9s@users.noreply.github.com

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Add inline history examples to docs
        run: |
          git config user.name "$GIT_AUTHOR_NAME"
          git config user.email "$GIT_AUTHOR_EMAIL"
          python .github/scripts/patch_history_docs_examples.py
          grep -F '!! x10' docs/debug_console.md docs/debug_console.zh-TW.md
          grep -F '!! +10' docs/debug_console.md docs/debug_console.zh-TW.md
          grep -F '!! 10' docs/debug_console.md docs/debug_console.zh-TW.md
          git diff --check
          git add docs/debug_console.md docs/debug_console.zh-TW.md
          git commit -m "Document inline history expansion examples"
          git push origin main
