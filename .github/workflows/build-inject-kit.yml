name: Build SMM Injection Kit

on:
  workflow_dispatch:
    inputs:
      upstream_ref:
        description: 'SPD tag/branch/commit used to compile the donor (blank = latest release)'
        required: false
        default: ''

permissions:
  contents: read

jobs:
  build-inject-kit:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout SMM source
        uses: actions/checkout@v4
        with:
          path: mod

      - name: Resolve SPD source ref
        id: upstream
        env:
          REQUESTED_REF: ${{ inputs.upstream_ref }}
        run: |
          if [ -n "$REQUESTED_REF" ]; then
            REF="$REQUESTED_REF"
          else
            LATEST_URL=$(curl -fsSL -o /dev/null -w '%{url_effective}' \
              https://github.com/00-Evan/shattered-pixel-dungeon/releases/latest)
            LATEST_URL="${LATEST_URL%/}"
            REF="${LATEST_URL##*/}"
            if [ -z "$REF" ] || [ "$REF" = "latest" ]; then
              echo "Failed to resolve latest SPD release tag from: $LATEST_URL" >&2
              exit 1
            fi
          fi
          test -n "$REF"
          echo "ref=$REF" >> "$GITHUB_OUTPUT"
          echo "Using SPD source ref: $REF"

      - name: Checkout SPD source
        uses: actions/checkout@v4
        with:
          repository: 00-Evan/shattered-pixel-dungeon
          ref: ${{ steps.upstream.outputs.ref }}
          path: spd_src

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v3

      - name: Merge SMM source
        run: |
          python mod/scripts/patch_android.py
          python mod/scripts/inject_mod.py spd_src/core/src/main/java/com/shatteredpixel/shatteredpixeldungeon/windows/WndGame.java
          cp -a mod/core spd_src/
          cp -a mod/android spd_src/ 2>/dev/null || true
          cp -a mod/desktop spd_src/ 2>/dev/null || true
          cp -a mod/assets spd_src/ 2>/dev/null || true
          python mod/scripts/patch_depth.py 26

      - name: Compile injection donors
        run: |
          chmod +x spd_src/gradlew
          (cd spd_src && ./gradlew android:assembleDebug :desktop:release)

      - name: Package injection kit
        id: package
        run: |
          DONOR_APK=$(find spd_src/android/build/outputs/apk/debug -name '*.apk' | head -1)
          DONOR_JAR=$(find spd_src/desktop/build/libs -name '*.jar' | head -1)
          MOD_VER=$(python mod/scripts/extract_version.py mod/core/src/main/java/com/spd/mod/ModGame.java)
          test -n "$DONOR_APK" -a -f "$DONOR_APK"
          test -n "$DONOR_JAR" -a -f "$DONOR_JAR"
          test -n "$MOD_VER"
          KIT_DIR="inject-kit"
          KIT_NAME="SMM-m${MOD_VER}-InjectKit"
          python mod/scripts/package_inject_kit.py \
            "$DONOR_APK" "$DONOR_JAR" "$KIT_DIR" \
            --repo-root mod
          echo "kit_dir=$KIT_DIR" >> "$GITHUB_OUTPUT"
          echo "kit_name=$KIT_NAME" >> "$GITHUB_OUTPUT"

      - name: Upload injection kit
        uses: actions/upload-artifact@v4
        with:
          name: ${{ steps.package.outputs.kit_name }}
          path: ${{ steps.package.outputs.kit_dir }}/*
          if-no-files-found: error
