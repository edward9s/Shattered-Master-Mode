name: one-shot-cross-package-inject

on:
  push:
    paths:
      - '.github/workflows/one-shot-cross-package-inject.yml'

permissions:
  contents: write

env:
  GIT_AUTHOR_NAME: edward9s
  GIT_AUTHOR_EMAIL: 277983297+edward9s@users.noreply.github.com
  GIT_COMMITTER_NAME: edward9s
  GIT_COMMITTER_EMAIL: 277983297+edward9s@users.noreply.github.com

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v3

      - name: Apply cross-package injector patch
        run: |
          git config user.name "$GIT_AUTHOR_NAME"
          git config user.email "$GIT_AUTHOR_EMAIL"
          python - <<'PY'
          from pathlib import Path
          p = Path('.github/scripts/patch_cross_package_inject.py')
          s = p.read_text(encoding='utf-8')
          s = s.replace("The injector must not use a generic rule such as 'copy every `com.spd.mod` class'.", "Do not assume that every donor class reachable from these classes is safe to copy into a target build.")
          s = s.replace("Injector 不應採用「把所有 `com.spd.mod` class 都複製進去」這種泛化規則。", "不要假設只要某個 donor class 能從上述 class 觸及，就適合一起複製到 target。")
          p.write_text(s, encoding='utf-8')
          PY
          python .github/scripts/patch_cross_package_inject.py
          python -m py_compile scripts/inject_apk.py scripts/inject_jar.py
          grep -F 'detect_target_game_prefix' scripts/inject_apk.py
          grep -F 'rebase_smali_payload' scripts/inject_apk.py
          grep -F 'detect_target_game_root' scripts/inject_jar.py
          grep -F 'rebase_class_bytes' scripts/inject_jar.py
          grep -F 'payload names themselves are never renamed' docs/modankh_payload_rules.md
          grep -F 'payload 自己的名稱則永遠不改' docs/modankh_payload_rules.zh-TW.md
          git diff --check

      - name: Checkout official SPD donor baseline
        uses: actions/checkout@v4
        with:
          repository: 00-Evan/shattered-pixel-dungeon
          ref: v3.3.8
          path: spd_src

      - name: Build one fresh SMM donor
        run: |
          python scripts/patch_android.py
          python scripts/inject_mod.py spd_src/core/src/main/java/com/shatteredpixel/shatteredpixeldungeon/windows/WndGame.java
          cp -a core spd_src/
          cp -a android spd_src/ 2>/dev/null || true
          cp -a desktop spd_src/ 2>/dev/null || true
          cp -a assets spd_src/ 2>/dev/null || true
          python scripts/patch_depth.py 26
          chmod +x spd_src/gradlew
          (cd spd_src && ./gradlew android:assembleRelease :desktop:release)
          DONOR_APK=$(find spd_src/android/build/outputs/apk/release -name '*.apk' | head -n1)
          DONOR_JAR=$(find spd_src/desktop/build/libs -name 'desktop-*.jar' | head -n1)
          test -f "$DONOR_APK" && test -f "$DONOR_JAR"
          echo "DONOR_APK=$DONOR_APK" >> "$GITHUB_ENV"
          echo "DONOR_JAR=$DONOR_JAR" >> "$GITHUB_ENV"

      - name: Download official SPD and Rat King targets
        run: |
          curl -fL https://github.com/00-Evan/shattered-pixel-dungeon/releases/download/v3.3.8/ShatteredPD-v3.3.8-Android.apk -o /tmp/spd.apk
          curl -fL https://github.com/00-Evan/shattered-pixel-dungeon/releases/download/v3.3.8/ShatteredPD-v3.3.8-Java.jar -o /tmp/spd.jar
          curl -fL https://github.com/TrashboxBobylev/Rat-King-Adventure/releases/download/2.3.3/android-release.apk -o /tmp/rka.apk
          curl -fL https://github.com/TrashboxBobylev/Rat-King-Adventure/releases/download/2.3.3/desktop-2.3.3.jar -o /tmp/rka.jar
          for f in /tmp/spd.apk /tmp/spd.jar /tmp/rka.apk /tmp/rka.jar; do unzip -t "$f" >/dev/null; done

      - name: Validate same-package official injection
        run: |
          python scripts/inject_apk.py "$DONOR_APK" /tmp/spd.apk --out /tmp/spd-injected.apk | tee /tmp/spd-apk.log
          python scripts/inject_jar.py "$DONOR_JAR" /tmp/spd.jar --out /tmp/spd-injected.jar | tee /tmp/spd-jar.log
          grep -F 'Target SPD-family package: com.shatteredpixel.shatteredpixeldungeon' /tmp/spd-apk.log
          grep -F 'Debug payload target API check: OK' /tmp/spd-apk.log
          grep -F 'Target SPD-family package: com.shatteredpixel.shatteredpixeldungeon' /tmp/spd-jar.log

      - name: Validate renamed-package Rat King injection
        run: |
          python scripts/inject_apk.py "$DONOR_APK" /tmp/rka.apk --out /tmp/rka-injected.apk | tee /tmp/rka-apk.log
          python scripts/inject_jar.py "$DONOR_JAR" /tmp/rka.jar --out /tmp/rka-injected.jar | tee /tmp/rka-jar.log
          grep -F 'Target SPD-family package: com.zrp200.rkpd2' /tmp/rka-apk.log
          grep -F 'Debug payload target API check: OK' /tmp/rka-apk.log
          grep -F 'Target SPD-family package: com.zrp200.rkpd2' /tmp/rka-jar.log

      - name: Verify rebased Assassin payloads
        run: |
          for apk in /tmp/spd-injected.apk /tmp/rka-injected.apk; do
            unzip -p "$apk" classes.dex | strings | grep -F 'Lcom/spd/mod/mechanics/ModAssassinBuff;'
            unzip -p "$apk" classes.dex | strings | grep -F 'Lcom/spd/mod/mechanics/ModAssassin;'
            unzip -p "$apk" classes.dex | strings | grep -F 'Lcom/spd/mod/mechanics/ModFlash;'
          done
          unzip -p /tmp/rka-injected.apk classes.dex | strings | grep -F 'Lcom/zrp200/rkpd2/actors/buffs/Buff;'
          ! unzip -p /tmp/rka-injected.apk classes.dex | strings | grep -F 'Lcom/shatteredpixel/shatteredpixeldungeon/actors/buffs/Buff;'
          for jar in /tmp/spd-injected.jar /tmp/rka-injected.jar; do
            unzip -l "$jar" | grep -F 'com/spd/mod/mechanics/ModAssassinBuff.class'
            unzip -l "$jar" | grep -F 'com/spd/mod/mechanics/ModAssassin.class'
            unzip -l "$jar" | grep -F 'com/spd/mod/mechanics/ModFlash.class'
          done
          unzip -p /tmp/rka-injected.jar com/spd/mod/mechanics/ModAssassinBuff.class | strings | grep -F 'com/zrp200/rkpd2/actors/buffs/Buff'
          ! unzip -p /tmp/rka-injected.jar com/spd/mod/mechanics/ModAssassinBuff.class | strings | grep -F 'com/shatteredpixel/shatteredpixeldungeon/actors/buffs/Buff'

      - name: Commit validated injector changes
        run: |
          git add scripts/inject_apk.py scripts/inject_jar.py docs/modankh_payload_rules.md docs/modankh_payload_rules.zh-TW.md
          git diff --cached --check
          git commit -m 'Support renamed SPD packages during injection'
          git push origin main
