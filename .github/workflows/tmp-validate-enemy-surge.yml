name: Validate Enemy Surge branch

on:
  push:
    branches:
      - fix/enemy-surge-respawner-hook

permissions:
  contents: read

jobs:
  unit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Run injector unit tests
        run: |
          python -m unittest             scripts.test_inject_apk_ui_compat             scripts.test_inject_jar_ankh_ui             scripts.test_package_inject_kit

  integration:
    runs-on: ubuntu-latest
    needs: unit
    steps:
      - name: Checkout SMM branch
        uses: actions/checkout@v4
        with:
          path: mod

      - name: Resolve current SPD release
        id: spd
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          REF=$(gh api repos/00-Evan/shattered-pixel-dungeon/releases/latest --jq .tag_name)
          test -n "$REF"
          echo "ref=$REF" >> "$GITHUB_OUTPUT"

      - name: Checkout SPD donor source
        uses: actions/checkout@v4
        with:
          repository: 00-Evan/shattered-pixel-dungeon
          ref: ${{ steps.spd.outputs.ref }}
          path: spd_src

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4

      - name: Build current SMM donor APK
        run: |
          set -euo pipefail
          python mod/scripts/rebase_source.py spd_src mod
          python mod/scripts/patch_android.py spd_src
          python mod/scripts/inject_mod.py spd_src
          cp -a mod/core spd_src/
          cp -a mod/android spd_src/ 2>/dev/null || true
          cp -a mod/desktop spd_src/ 2>/dev/null || true
          cp -a mod/assets spd_src/ 2>/dev/null || true
          chmod +x spd_src/gradlew
          (cd spd_src && ./gradlew android:assembleDebug)
          DONOR=$(find spd_src/android/build/outputs/apk/debug -type f -name '*.apk' | head -1)
          test -n "$DONOR" -a -f "$DONOR"
          cp "$DONOR" mod/scripts/smm-inject-donor.apk

      - name: Download official MLPD APK
        run: |
          curl -fL --retry 3             -o mlpd.apk             https://github.com/LingASDJ/Magic_Ling_Pixel_Dungeon/releases/download/0.9.4.2/MLPD-V0.9.4.2.APK

      - name: Inject Enemy Surge into MLPD APK
        run: |
          set -euo pipefail
          python mod/scripts/inject_apk.py mlpd.apk --ankh-only --out mlpd-smm.apk 2>&1 | tee mlpd-inject.log
          test -f mlpd-smm.apk
          grep -F "Enemy Surge native respawner hook" mlpd-inject.log
          if grep -F "Optional Enemy Surge skipped" mlpd-inject.log; then
            echo "Enemy Surge was unexpectedly skipped for MLPD" >&2
            exit 1
          fi

      - name: Checkout ARK source
        uses: actions/checkout@v4
        with:
          repository: tomorrows-ark-pd/ARK_PD
          ref: main
          path: ark

      - name: Build ARK release APK
        working-directory: ark
        run: |
          chmod +x gradlew
          ./gradlew :android:assembleRelease

      - name: Inject Enemy Surge into ARK APK
        run: |
          set -euo pipefail
          ARK_APK=$(find ark/android/build/outputs/apk/release -type f -name '*.apk' | head -1)
          test -n "$ARK_APK" -a -f "$ARK_APK"
          python mod/scripts/inject_apk.py "$ARK_APK" --ankh-only --out ark-smm.apk 2>&1 | tee ark-inject.log
          test -f ark-smm.apk
          grep -F "Enemy Surge native respawner hook" ark-inject.log
          if grep -F "Optional Enemy Surge skipped" ark-inject.log; then
            echo "Enemy Surge was unexpectedly skipped for ARK" >&2
            exit 1
          fi
