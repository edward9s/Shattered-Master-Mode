name: one-shot-console-history-sync

on:
  push:
    paths:
      - '.github/workflows/one-shot-console-history-sync.yml'

permissions:
  contents: write

env:
  GIT_AUTHOR_NAME: edward9s
  GIT_AUTHOR_EMAIL: 277983297+edward9s@users.noreply.github.com
  GIT_COMMITTER_NAME: edward9s
  GIT_COMMITTER_EMAIL: 277983297+edward9s@users.noreply.github.com

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Synchronize Console history semantics
        run: |
          git config user.name "$GIT_AUTHOR_NAME"
          git config user.email "$GIT_AUTHOR_EMAIL"
          python .github/scripts/patch_console_history_sync.py
          grep -F '@ | !! | search' 'core/src/main/java/com/spd/mod/mechanics/ModDebug$Console.java' core/src/main/java/com/spd/mod/mechanics/ModDebug.java
          grep -F 'Integer historyCount = historyRepeatCount(command);' 'core/src/main/java/com/spd/mod/mechanics/ModDebug$Console.java'
          grep -F 'No previous command in this macro invocation' 'core/src/main/java/com/spd/mod/mechanics/ModDebug$Console.java'
          grep -F 'commandOrMacroNeedsSelector(line, depth + 1)' 'core/src/main/java/com/spd/mod/mechanics/ModDebug$Console.java'
          if grep -Fq 'private static boolean commandNeedsSelector' 'core/src/main/java/com/spd/mod/mechanics/ModDebug$Console.java'; then
            echo 'legacy selector helper still present'
            exit 1
          fi
          git diff --check
          git add core/src/main/java/com/spd/mod/mechanics/ModDebug.java 'core/src/main/java/com/spd/mod/mechanics/ModDebug$Console.java'
          git commit -m "Synchronize console history behavior"
          git push origin main
