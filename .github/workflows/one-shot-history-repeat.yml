name: one-shot-history-repeat

on:
  push:
    paths:
      - '.github/workflows/one-shot-history-repeat.yml'

permissions:
  contents: write

env:
  GIT_AUTHOR_NAME: edward9s
  GIT_AUTHOR_EMAIL: 277983297+edward9s@users.noreply.github.com
  GIT_COMMITTER_NAME: edward9s
  GIT_COMMITTER_EMAIL: 277983297+edward9s@users.noreply.github.com

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Replace repeat with history replay
        run: |
          git config user.name "$GIT_AUTHOR_NAME"
          git config user.email "$GIT_AUTHOR_EMAIL"
          python .github/scripts/patch_history_repeat.py
          grep -F 'HISTORY_COMMAND' core/src/main/java/com/spd/mod/mechanics/ModDebug.java
          grep -F 'No previous command in this macro invocation' core/src/main/java/com/spd/mod/mechanics/ModDebug.java
          grep -F '!! [count]' core/src/main/java/com/spd/mod/mechanics/ModDebug.java
          grep -F '!! 100' docs/debug_console.md docs/debug_console.zh-TW.md
          if grep -R -n 'repeat <count>\|case "repeat"\|"macro", "repeat"' core/src/main/java/com/spd/mod/mechanics/ModDebug.java docs/debug_console.md docs/debug_console.zh-TW.md; then
            echo 'legacy repeat syntax remains' >&2
            exit 1
          fi
          git diff --check
          git add core/src/main/java/com/spd/mod/mechanics/ModDebug.java docs/debug_console.md docs/debug_console.zh-TW.md
          git commit -m "Use history replay for repeated debug commands"
          git push origin main
