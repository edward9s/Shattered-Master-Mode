name: Diagnose beta item info metadata paths

on:
  push:
    branches: [ main ]
    paths:
      - '.github/workflows/diagnose-beta-item-info.yml'

permissions:
  contents: read

jobs:
  diagnose:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - name: Download binary baselines
        run: |
          curl -fL https://github.com/00-Evan/shattered-pixel-dungeon/releases/download/v3.3.8/ShatteredPD-v3.3.8-Java.jar -o spd338.jar
          curl -fL https://github.com/00-Evan/shattered-pixel-dungeon/releases/download/4.0.0-beta/ShatteredPD-v4.0.0-BETA-4-Java.jar -o spd4.jar
      - name: Compare Item metadata bytecode
        run: |
          javap -classpath spd338.jar -p -c com.shatteredpixel.shatteredpixeldungeon.items.Item > item338.txt
          javap -classpath spd4.jar -p -c com.shatteredpixel.shatteredpixeldungeon.items.Item > item4.txt
          echo '===== 3.3.8 Item.info ====='
          sed -n '/public java.lang.String info()/,/^[[:space:]]*public\|^[[:space:]]*protected\|^[[:space:]]*private/p' item338.txt
          echo '===== BETA-4 Item.info ====='
          sed -n '/public java.lang.String info()/,/^[[:space:]]*public\|^[[:space:]]*protected\|^[[:space:]]*private/p' item4.txt
          echo '===== Item.info diff ====='
          sed -n '/public java.lang.String info()/,/^[[:space:]]*public\|^[[:space:]]*protected\|^[[:space:]]*private/p' item338.txt > info338.txt
          sed -n '/public java.lang.String info()/,/^[[:space:]]*public\|^[[:space:]]*protected\|^[[:space:]]*private/p' item4.txt > info4.txt
          diff -u info338.txt info4.txt || true
