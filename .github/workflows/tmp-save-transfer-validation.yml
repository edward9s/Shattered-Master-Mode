name: Temporary save transfer validation

on:
  push:
    branches:
      - save-transfer-app-name

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Compile modified Python
        run: |
          python -m py_compile \
            scripts/_inject_app_name.py \
            scripts/_inject_apk_core.py \
            scripts/_inject_jar_core.py \
            scripts/patch_android.py \
            scripts/package_inject_kit.py
      - name: Run focused tests
        run: |
          python -m unittest \
            scripts.test_inject_app_name \
            scripts.test_mod_save_transfer_compat \
            scripts.test_package_inject_kit
