name: one-shot-debug-bee-spawn

on:
  push:
    paths:
      - '.github/workflows/one-shot-debug-bee-spawn.yml'

permissions:
  contents: write

env:
  GIT_AUTHOR_NAME: edward9s
  GIT_AUTHOR_EMAIL: 277983297+edward9s@users.noreply.github.com
  GIT_COMMITTER_NAME: edward9s
  GIT_COMMITTER_EMAIL: 277983297+edward9s@users.noreply.github.com

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Fix debug Bee initialization
        run: |
          git config user.name "$GIT_AUTHOR_NAME"
          git config user.email "$GIT_AUTHOR_EMAIL"
          python .github/scripts/patch_debug_bee_spawn.py
          grep -F 'BEE_CLASS' core/src/main/java/com/spd/mod/mechanics/ModDebug.java
          grep -F 'initializeConstructedMobForDebug(mob)' core/src/main/java/com/spd/mod/mechanics/ModDebug.java
          grep -F '"scalingDepth"' core/src/main/java/com/spd/mod/mechanics/ModDebug.java
          grep -F '"setPotInfo"' core/src/main/java/com/spd/mod/mechanics/ModDebug.java
          grep -F 'mob.HP = mob.HT;' core/src/main/java/com/spd/mod/mechanics/ModDebug.java
          git diff --check
          git add core/src/main/java/com/spd/mod/mechanics/ModDebug.java
          git commit -m "Initialize debug-spawned bees correctly"
          git push origin main
