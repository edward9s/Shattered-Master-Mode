name: One-time portable zipalign extra fix

on:
  push:
    paths:
      - '.github/workflows/_fix-portable-zipalign-extra.yml'

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Patch portable ZIP aligner
        run: |
          python - <<'PY'
          from pathlib import Path

          injector = Path('scripts/inject_apk.py')
          text = injector.read_text(encoding='utf-8')

          anchor = '''def _add_alignment_extra(\n    info: zipfile.ZipInfo,\n    header_offset: int,\n    alignment: int,\n) -> None:\n'''
          helper = '''def _normalize_zip_extra(extra: bytes, filename: str) -> bytes:\n    """Preserve complete ZIP extra records while dropping 1-3 trailing padding bytes."""\n    offset = 0\n    length = len(extra)\n    while offset + 4 <= length:\n        _field_id, payload_size = struct.unpack_from("<HH", extra, offset)\n        end = offset + 4 + payload_size\n        if end > length:\n            raise injector.InjectError(\n                f"Malformed ZIP extra field while aligning {filename}"\n            )\n        offset = end\n    return extra[:offset]\n\n\n'''
          if helper not in text:
              if anchor not in text:
                  raise SystemExit('inject_apk.py helper insertion anchor not found')
              text = text.replace(anchor, helper + anchor, 1)

          old = '''        for source_info in zin.infolist():\n            info = copy.copy(source_info)\n            alignment = _alignment_for_entry(info)\n'''
          new = '''        for source_info in zin.infolist():\n            info = copy.copy(source_info)\n            # Some APK repackers leave 1-3 raw padding bytes at the end of a\n            # central-directory extra field. Python tolerates those bytes while\n            # reading the source, but appending another extra-field record turns\n            # the old padding into the start of a bogus record. Preserve every\n            # complete record and discard only that trailing padding before adding\n            # our alignment record.\n            info.extra = _normalize_zip_extra(info.extra, info.filename)\n            alignment = _alignment_for_entry(info)\n'''
          if old in text:
              text = text.replace(old, new, 1)
          elif new not in text:
              raise SystemExit('inject_apk.py portable align loop anchor not found')
          injector.write_text(text, encoding='utf-8')
          PY

          git config user.name 'edward9s'
          git config user.email '277983297+edward9s@users.noreply.github.com'
          git add scripts/inject_apk.py
          git commit -m 'Handle trailing ZIP extra padding in portable aligner'
          git push
