name: one-shot-debug-lifecycle-docs

on:
  push:
    paths:
      - '.github/workflows/one-shot-debug-lifecycle-docs.yml'

permissions:
  contents: write

env:
  GIT_AUTHOR_NAME: edward9s
  GIT_AUTHOR_EMAIL: 277983297+edward9s@users.noreply.github.com
  GIT_COMMITTER_NAME: edward9s
  GIT_COMMITTER_EMAIL: 277983297+edward9s@users.noreply.github.com

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Document handle and macro lifecycle
        run: |
          git config user.name "$GIT_AUTHOR_NAME"
          git config user.email "$GIT_AUTHOR_EMAIL"
          python .github/scripts/patch_debug_lifecycle_docs.py
          grep -F 'Handles are process-local only' core/src/main/java/com/spd/mod/mechanics/ModDebug.java
          grep -F 'Macros are persisted across app/process restarts' core/src/main/java/com/spd/mod/mechanics/ModDebug.java
          grep -F 'filesDir/smm-debug-macros.properties' docs/debug_console.md
          grep -F 'filesDir/smm-debug-macros.properties' docs/debug_console.zh-TW.md
          ! grep -F 'spawn Rat -p' docs/debug_console.md
          ! grep -F 'spawn Rat -p' docs/debug_console.zh-TW.md
          git diff --check
          git add core/src/main/java/com/spd/mod/mechanics/ModDebug.java docs/debug_console.md docs/debug_console.zh-TW.md
          git commit -m "Document debug handle and macro lifecycle"
          git push origin main
