name: one-shot-terrain-raw-id

on:
  push:
    paths:
      - '.github/workflows/one-shot-terrain-raw-id.yml'

permissions:
  contents: write

env:
  GIT_AUTHOR_NAME: edward9s
  GIT_AUTHOR_EMAIL: 277983297+edward9s@users.noreply.github.com
  GIT_COMMITTER_NAME: edward9s
  GIT_COMMITTER_EMAIL: 277983297+edward9s@users.noreply.github.com

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Add raw terrain ID support
        run: |
          git config user.name "$GIT_AUTHOR_NAME"
          git config user.email "$GIT_AUTHOR_EMAIL"
          python .github/scripts/patch_terrain_raw_id.py
          grep -F 'terrain <Terrain|id> [cell|@variable]' core/src/main/java/com/spd/mod/mechanics/ModDebug.java docs/debug_console.md docs/debug_console.zh-TW.md
          grep -F 'Using raw terrain ID' core/src/main/java/com/spd/mod/mechanics/ModDebug.java
          grep -F 'terrainIdLimit()' core/src/main/java/com/spd/mod/mechanics/ModDebug.java
          grep -F 'terrain 123 @cell' docs/debug_console.md docs/debug_console.zh-TW.md
          git diff --check
          git add core/src/main/java/com/spd/mod/mechanics/ModDebug.java docs/debug_console.md docs/debug_console.zh-TW.md
          git commit -m "Allow raw terrain IDs in debug console"
          git push origin main
