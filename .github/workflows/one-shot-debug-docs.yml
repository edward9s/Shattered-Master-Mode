name: one-shot-debug-docs

on:
  push:
    paths:
      - '.github/workflows/one-shot-debug-docs.yml'

permissions:
  contents: write

env:
  GIT_AUTHOR_NAME: edward9s
  GIT_AUTHOR_EMAIL: 277983297+edward9s@users.noreply.github.com
  GIT_COMMITTER_NAME: edward9s
  GIT_COMMITTER_EMAIL: 277983297+edward9s@users.noreply.github.com

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Update debug console docs
        run: |
          git config user.name "$GIT_AUTHOR_NAME"
          git config user.email "$GIT_AUTHOR_EMAIL"
          python .github/scripts/patch_debug_console_docs.py
          grep -F 'enchant @weapon Grim' docs/debug_console.md docs/debug_console.zh-TW.md
          grep -F 'Terrain LOCKED_DOOR' docs/debug_console.md docs/debug_console.zh-TW.md
          grep -F 'new:<Class>' docs/debug_console.md docs/debug_console.zh-TW.md
          git diff --check
          git add docs/debug_console.md docs/debug_console.zh-TW.md
          git commit -m "Update debug console documentation"
          git push origin main
