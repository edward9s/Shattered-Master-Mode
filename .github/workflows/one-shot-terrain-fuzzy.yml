name: one-shot-terrain-fuzzy

on:
  push:
    paths:
      - '.github/workflows/one-shot-terrain-fuzzy.yml'

permissions:
  contents: write

env:
  GIT_AUTHOR_NAME: edward9s
  GIT_AUTHOR_EMAIL: 277983297+edward9s@users.noreply.github.com
  GIT_COMMITTER_NAME: edward9s
  GIT_COMMITTER_EMAIL: 277983297+edward9s@users.noreply.github.com

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Apply terrain and fuzzy patch
        run: |
          git config user.name "$GIT_AUTHOR_NAME"
          git config user.email "$GIT_AUTHOR_EMAIL"
          python .github/scripts/patch_terrain_fuzzy.py
          grep -F 'case "terrain"' core/src/main/java/com/spd/mod/mechanics/ModDebug.java
          grep -F 'resolveFuzzyClass' core/src/main/java/com/spd/mod/mechanics/ModDebug.java
          grep -F 'refreshTerrainCell(cell);' core/src/main/java/com/spd/mod/mechanics/ModDebug.java
          grep -F 'terrain chsm' docs/debug_console.md docs/debug_console.zh-TW.md
          grep -F 'trap alarm' docs/debug_console.md docs/debug_console.zh-TW.md
          git diff --check
          git add core/src/main/java/com/spd/mod/mechanics/ModDebug.java docs/debug_console.md docs/debug_console.zh-TW.md
          git commit -m "Add fuzzy terrain debug command"
          git push origin main
